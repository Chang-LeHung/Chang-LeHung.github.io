<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 907 642" role="img" aria-label="LinkedList 的继承体系，其中 AbstractCollection 被红色圆角框圈出，作为重点" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" width="907" height="642">
  <defs>
    <marker id="arrow-linkedlist10-g" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#56804c"/>
    </marker>
    <marker id="arrow-linkedlist10-b" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f89d4"/>
    </marker>
    <g id="impl-linkedlist10">
      <rect x="0" y="0" width="11" height="11" rx="2" fill="none" stroke="#579141" stroke-width="1"/>
      <path d="M5.5 9 V3.5 M5.5 3.5 L3 6 M5.5 3.5 L8 6" fill="none" stroke="#579141" stroke-width="1.4"/>
    </g>
  </defs>

  <rect x="0" y="0" width="907" height="642" fill="#282a36"/>

  <!-- 类与接口 -->
  <g stroke="#5a5b5f" stroke-width="1.5" fill="#3c3c3c">
    <rect x="323" y="57" width="125" height="51" rx="2"/>
    <rect x="313" y="150" width="142" height="52" rx="2"/>
    <rect x="100" y="244" width="230" height="51" rx="2"/>
    <rect x="348" y="244" width="82" height="51" rx="2"/>
    <rect x="447" y="244" width="92" height="51" rx="2"/>
    <rect x="174" y="337" width="166" height="52" rx="2"/>
    <rect x="447" y="337" width="92" height="52" rx="2"/>
    <rect x="121" y="431" width="272" height="52" rx="2"/>
    <rect x="502" y="431" width="167" height="52" rx="2"/>
    <rect x="686" y="431" width="135" height="52" rx="2"/>
    <rect x="423" y="527" width="146" height="51" rx="2"/>
  </g>

  <!-- 类名分隔线 -->
  <path stroke="#5a5b5f" stroke-width="1"
