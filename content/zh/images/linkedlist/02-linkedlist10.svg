  <g fill="none" stroke="#4f89d4" stroke-width="1.5">
    <path d="M215 337 V297" marker-end="url(#arrow-linkedlist10-b)"/>
    <path d="M257 431 V391" marker-end="url(#arrow-linkedlist10-b)"/>
    <path d="M438 527 V522 H257 V485" marker-end="url(#arrow-linkedlist10-b)"/>
