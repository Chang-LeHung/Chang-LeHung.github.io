           M423 554 H569"/>

  <!-- 接口图标 I -->
  <g fill="#579141" text-anchor="middle" font-size="9" font-weight="bold">
    <circle cx="335" cy="71" r="7"/><text x="335" y="74" fill="#282a36">I</text>
    <circle cx="325" cy="164" r="7"/><text x="325" y="167" fill="#282a36">I</text>
    <circle cx="360" cy="258" r="7"/><text x="360" y="261" fill="#282a36">I</text>
    <circle cx="459" cy="258" r="7"/><text x="459" y="261" fill="#282a36">I</text>
    <circle cx="514" cy="445" r="7"/><text x="514" y="448" fill="#282a36">I</text>
    <circle cx="698" cy="445" r="7"/><text x="698" y="448" fill="#282a36">I</text>
  </g>
  <!-- 类图标 C -->
  <g fill="#3e859e" text-anchor="middle" font-size="9" font-weight="bold">
    <circle cx="112" cy="258" r="7"/><text x="112" y="261" fill="#282a36">C</text>
    <circle cx="186" cy="351" r="7"/><text x="186" y="354" fill="#282a36">C</text>
