  <!-- 已实现标记 -->
  <use href="#impl-linkedlist10" x="345" y="65"/>
  <use href="#impl-linkedlist10" x="335" y="158"/>
  <use href="#impl-linkedlist10" x="122" y="252"/>
  <use href="#impl-linkedlist10" x="370" y="252"/>
  <use href="#impl-linkedlist10" x="469" y="252"/>
  <use href="#impl-linkedlist10" x="196" y="345"/>
  <use href="#impl-linkedlist10" x="469" y="345"/>
  <use href="#impl-linkedlist10" x="143" y="439"/>
  <use href="#impl-linkedlist10" x="524" y="439"/>
  <use href="#impl-linkedlist10" x="708" y="439"/>
  <use href="#impl-linkedlist10" x="445" y="535"/>

  <g font-size="16" fill="#f0f0f0">
    <text x="360" y="77">Iterable</text>
    <text x="350" y="170">Collection</text>
    <text x="137" y="264">AbstractCollection</text>
    <text x="385" y="264">List</text>
    <text x="484" y="264">Queue</text>
    <text x="211" y="357">AbstractList</text>
    <text x="484" y="357">Deque</text>
    <text x="158" y="451">AbstractSequentialList</text>
    <text x="539" y="451">Serializable</text>
    <text x="723" y="451">Cloneable</text>
    <text x="460" y="547">LinkedList</text>
  </g>

  <!-- 绿色实线：extends -->
  <g fill="none" stroke="#56804c" stroke-width="1.5">
    <path d="M385 150 V111" marker-end="url(#arrow-linkedlist10-g)"/>
    <path d="M387 244 V205" marker-end="url(#arrow-linkedlist10-g)"/>
    <path d="M493 244 V225 H435 V205" marker-end="url(#arrow-linkedlist10-g)"/>
    <path d="M493 337 V297" marker-end="url(#arrow-linkedlist10-g)"/>
