<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 587" role="img" aria-label="LinkedList 的继承体系：Collection 继承 Iterable，AbstractCollection、List、Queue 实现 Collection，LinkedList 位于最底部" font-family="Seaford, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" width="768" height="587">
