<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 886 343" role="img" aria-label="四个节点首尾相接，prev 指针向左、next 指针向右，first 指向第一个节点，last 指向最后一个节点" font-family="Seaford, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" width="886" height="343">
  <defs>
    <marker id="arrow-linkedlist03" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- 四个节点：item / prev / next 三格 -->
  <g stroke-width="1.5">
    <g>
      <rect x="137" y="47" width="80" height="37" fill="#fff2cc" stroke="#d6b656"/>
      <rect x="137" y="84" width="80" height="37" fill="#f8cecc" stroke="#b85450"/>
      <rect x="137" y="121" width="80" height="37" fill="#d5e8d4" stroke="#82b366"/>
    </g>
    <g>
      <rect x="311" y="47" width="80" height="37" fill="#fff2cc" stroke="#d6b656"/>
      <rect x="311" y="84" width="80" height="37" fill="#f8cecc" stroke="#b85450"/>
      <rect x="311" y="121" width="80" height="37" fill="#d5e8d4" stroke="#82b366"/>
    </g>
    <g>
      <rect x="485" y="47" width="80" height="37" fill="#fff2cc" stroke="#d6b656"/>
      <rect x="485" y="84" width="80" height="37" fill="#f8cecc" stroke="#b85450"/>
      <rect x="485" y="121" width="80" height="37" fill="#d5e8d4" stroke="#82b366"/>
    </g>
    <g>
      <rect x="659" y="47" width="80" height="37" fill="#fff2cc" stroke="#d6b656"/>
      <rect x="659" y="84" width="80" height="37" fill="#f8cecc" stroke="#b85450"/>
      <rect x="659" y="121" width="80" height="37" fill="#d5e8d4" stroke="#82b366"/>
    </g>
  </g>

  <g font-size="15" fill="#000" text-anchor="middle">
    <text x="177" y="71">item</text>
    <text x="177" y="108">prev</text>
    <text x="177" y="145">next</text>
    <text x="351" y="71">item</text>
    <text x="351" y="108">prev</text>
    <text x="351" y="145">next</text>
    <text x="525" y="71">item</text>
    <text x="525" y="108">prev</text>
    <text x="525" y="145">next</text>
    <text x="699" y="71">item</text>
    <text x="699" y="108">prev</text>
    <text x="699" y="145">next</text>
  </g>

  <!-- first / last -->
  <g stroke-width="1.5">
    <rect x="126" y="236" width="99" height="58" rx="6" fill="#b1ddf0" stroke="#6fb1ce"/>
    <rect x="648" y="236" width="99" height="58" rx="6" fill="#b1ddf0" stroke="#6fb1ce"/>
  </g>
  <g font-size="15" fill="#000" text-anchor="middle">
    <text x="175" y="272">first</text>
    <text x="697" y="272">last</text>
  </g>

  <!-- 指针连线 -->
  <g fill="none" stroke="#444" stroke-width="1.5">
    <path d="M309 102 H220" marker-end="url(#arrow-linkedlist03)"/>
    <path d="M483 102 H394" marker-end="url(#arrow-linkedlist03)"/>
    <path d="M657 102 H568" marker-end="url(#arrow-linkedlist03)"/>
    <path d="M136 102 H93" marker-end="url(#arrow-linkedlist03)"/>

    <path d="M218 139 H306" marker-end="url(#arrow-linkedlist03)"/>
    <path d="M392 139 H480" marker-end="url(#arrow-linkedlist03)"/>
    <path d="M566 139 H654" marker-end="url(#arrow-linkedlist03)"/>
    <path d="M739 139 H793" marker-end="url(#arrow-linkedlist03)"/>

    <path d="M175 236 V159" marker-end="url(#arrow-linkedlist03)"/>
    <path d="M698 236 V159" marker-end="url(#arrow-linkedlist03)"/>
  </g>
</svg>
