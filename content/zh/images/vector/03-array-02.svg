<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1109 514" role="img" aria-label="Java 堆区中的对象与数组下标的对应关系：前四个下标有数据，用曲线分别指向堆中的对象" font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif" width="1109" height="514">
  <defs>
    <marker id="arrow-array02" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- 右侧：Java 堆区 -->
  <text x="812" y="41" font-size="26" fill="#000" text-anchor="middle">Java堆区</text>
  <rect x="596" y="70" width="430" height="295" rx="32" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>

  <!-- 堆中的对象 -->
  <g fill="#008a00" stroke="#005700" stroke-width="1.5">
    <circle cx="677" cy="119" r="24"/>
    <circle cx="677" cy="192" r="24"/>
    <circle cx="790" cy="190" r="24"/>
    <circle cx="905" cy="231" r="24"/>
  </g>

  <!-- 左侧图例 -->
  <circle cx="74" cy="119" r="24" fill="#008a00" stroke="#005700" stroke-width="1.5"/>
  <text x="137" y="134" font-size="26" fill="#000">Java堆中的对象</text>

  <rect x="39" y="170" width="78" height="33" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <text x="138" y="196" font-size="22" fill="#000">有数据</text>

  <rect x="39" y="224" width="78" height="33" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="138" y="248" font-size="22" fill="#000">无数据</text>

  <!-- 曲线：下标 0/1 指向上排两个对象，下标 2/3 指向右下两个对象 -->
  <g fill="none" stroke="#444" stroke-width="1.5">
    <path d="M152 410 C152.7 402.5 153 381.7 156 365 C159 348.3 161.7 329.2 170 310
             C178.3 290.8 188 270 206 250 C224 230 243 208.3 278 190
             C313 171.7 369 151.5 416 140 C463 128.5 521 124.5 560 121
             C599 117.5 635 119.3 650 119" marker-end="url(#arrow-array02)"/>
    <path d="M230 410 C230.7 403.3 231.2 383.3 234 370 C236.8 356.7 240 343.3 247 330
             C254 316.7 262.7 303.3 276 290 C289.3 276.7 299.8 263.3 327 250
             C354.2 236.7 400.2 219.3 439 210 C477.8 200.7 524.8 197 560 194
             C595.2 191 635 192.3 650 192" marker-end="url(#arrow-array02)"/>
    <path d="M308 410 C309.2 405 305.8 391.7 315 380 C324.2 368.3 335.5 350.8 363 340
             C390.5 329.2 440.5 319.7 480 315 C519.5 310.3 563.3 314.5 600 312
             C636.7 309.5 671.7 307 700 300 C728.3 293 755.3 280.8 770 270
             C784.7 259.2 784.7 244.3 788 235 C791.3 225.7 789.7 217.5 790 214"
          marker-end="url(#arrow-array02)"/>
    <path d="M386 410 C388.3 405 387.2 390 400 380 C412.8 370 439.7 357 463 350
             C486.3 343 507.2 340.8 540 338 C572.8 335.2 620 334.8 660 333
             C700 331.2 746.7 330.7 780 327 C813.3 323.3 842.5 316 860 311
             C877.5 306 877.8 303 885 297 C892.2 291 899.7 282 903 275
             C906.3 268 904.7 258.3 905 255" marker-end="url(#arrow-array02)"/>
  </g>

  <!-- 底部：数据行与下标行 -->
  <g fill="none" stroke="#000" stroke-width="1.5">
    <rect x="113" y="410" width="936" height="67"/>
    <path d="M113 443 H1049"/>
    <path d="M191 410 V477 M269 410 V477 M347 410 V477 M425 410 V477 M503 410 V477
             M581 410 V477 M659 410 V477 M737 410 V477 M815 410 V477 M893 410 V477 M971 410 V477"/>
  </g>

  <!-- 有数据的四个格子 -->
  <g fill="#f8cecc" stroke="#b85450" stroke-width="1.5">
    <rect x="114" y="411" width="310" height="32"/>
    <path d="M191 411 V443 M269 411 V443 M347 411 V443"/>
  </g>

  <text x="34" y="435" font-size="22" fill="#000">数据</text>
  <text x="34" y="469" font-size="22" fill="#000">下标</text>

  <g font-size="22" fill="#000" text-anchor="middle">
    <text x="152" y="469">0</text>
    <text x="230" y="469">1</text>
    <text x="308" y="469">2</text>
    <text x="386" y="469">3</text>
    <text x="464" y="469">4</text>
    <text x="542" y="469">5</text>
    <text x="620" y="469">6</text>
    <text x="698" y="469">7</text>
    <text x="776" y="469">8</text>
    <text x="854" y="469">9</text>
    <text x="932" y="469">10</text>
    <text x="1010" y="469">11</text>
  </g>
</svg>
