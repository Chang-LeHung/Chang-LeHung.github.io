<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 991 628" role="img" aria-label="ArrayList 的类层次结构图：Iterable、Collection、AbstractCollection、List、AbstractList 与 ArrayList 的继承与实现关系" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" width="991" height="628">
  <defs>
    <marker id="arrow-array10-green" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#609350"/>
    </marker>
    <marker id="arrow-array10-blue" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#589df6"/>
    </marker>
  </defs>

  <rect width="991" height="628" fill="#282a36"/>

  <!-- 连线：绿实线=继承，绿虚线=实现，蓝线=当前高亮路径 -->
  <g fill="none" stroke="#609350" stroke-width="1.5">
    <path d="M800 165 V116" marker-end="url(#arrow-array10-green)"/>
    <path d="M903 281 V256 H844 V232" marker-end="url(#arrow-array10-green)"/>
  </g>
  <g fill="none" stroke="#609350" stroke-width="1.5" stroke-dasharray="5 3">
    <path d="M694 281 V256 H756 V232" marker-end="url(#arrow-array10-green)"/>
    <path d="M795 397 V372 H878 V350" marker-end="url(#arrow-array10-green)"/>
    <path d="M607 513 V493 H928 V350" marker-end="url(#arrow-array10-green)"/>
    <path d="M541 513 V466" marker-end="url(#arrow-array10-green)"/>
    <path d="M508 513 V483 H338 V466" marker-end="url(#arrow-array10-green)"/>
    <path d="M475 513 V493 H116 V466" marker-end="url(#arrow-array10-green)"/>
  </g>
  <g fill="none" stroke="#589df6" stroke-width="1.5">
    <path d="M694 397 V350" marker-end="url(#arrow-array10-blue)"/>
    <path d="M574 513 V483 H744 V466" marker-end="url(#arrow-array10-blue)"/>
  </g>

