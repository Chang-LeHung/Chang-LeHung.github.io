    <text y="3" font-size="9" font-weight="bold" fill="#3c3c3c" text-anchor="middle" font-family="monospace">I</text>
    <path d="M11.5 -1 V-2.5 Q11.5 -3.5 12.5 -3.5 H13.5 Q14.5 -3.5 14.5 -2.5 V-1" fill="none" stroke="#579141" stroke-width="1"/>
    <rect x="11.5" y="-1" width="6" height="5" fill="#579141"/>
  </g>
  <text x="768" y="77" font-size="21" fill="#f8f8f2" font-family="monospace">Iterable</text>

