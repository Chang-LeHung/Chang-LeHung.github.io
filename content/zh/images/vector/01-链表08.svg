<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 118" role="img" aria-label="由五个节点组成的链表，每个节点分为 data 和 next 两格，由箭头依次相连，最后一个 next 指向空" font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif" width="1024" height="118">
  <defs>
    <marker id="arrow-node08" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- 五个节点：上格 data，下格 next -->
  <g stroke-width="1.5">
    <rect x="99" y="26" width="79" height="36" fill="#fff2cc" stroke="#d6b656"/>
    <rect x="99" y="62" width="79" height="38" fill="#d5e8d4" stroke="#82b366"/>
    <rect x="273" y="26" width="79" height="36" fill="#fff2cc" stroke="#d6b656"/>
    <rect x="273" y="62" width="79" height="38" fill="#d5e8d4" stroke="#82b366"/>
    <rect x="447" y="26" width="79" height="36" fill="#fff2cc" stroke="#d6b656"/>
    <rect x="447" y="62" width="79" height="38" fill="#d5e8d4" stroke="#82b366"/>
    <rect x="621" y="26" width="79" height="36" fill="#fff2cc" stroke="#d6b656"/>
    <rect x="621" y="62" width="79" height="38" fill="#d5e8d4" stroke="#82b366"/>
    <rect x="795" y="26" width="79" height="36" fill="#fff2cc" stroke="#d6b656"/>
    <rect x="795" y="62" width="79" height="38" fill="#d5e8d4" stroke="#82b366"/>
  </g>

  <g font-size="20" fill="#000" text-anchor="middle">
    <text x="138" y="50">data</text>
    <text x="138" y="88">next</text>
    <text x="312" y="50">data</text>
    <text x="312" y="88">next</text>
    <text x="486" y="50">data</text>
    <text x="486" y="88">next</text>
    <text x="660" y="50">data</text>
    <text x="660" y="88">next</text>
    <text x="834" y="50">data</text>
    <text x="834" y="88">next</text>
  </g>

  <g fill="none" stroke="#444" stroke-width="1.5">
    <path d="M178 82 H272" marker-end="url(#arrow-node08)"/>
    <path d="M352 82 H446" marker-end="url(#arrow-node08)"/>
    <path d="M526 82 H620" marker-end="url(#arrow-node08)"/>
    <path d="M700 82 H794" marker-end="url(#arrow-node08)"/>
    <path d="M874 82 H934" marker-end="url(#arrow-node08)"/>
  </g>
</svg>
