<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1026 318" role="img" aria-label="链表中第 3 个结点的 next 用红色箭头指向第 4 个结点，同时两条被红色叉号划掉的曲线从该结点绕到下方游离结点再绕回第 4 个结点" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" width="1026" height="318">
  <defs>
    <marker id="arrow-01-07" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrow-01-07r" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff0000"/>
    </marker>
  </defs>

  <!-- 结点 1 -->
  <rect x="104" y="28" width="82" height="38" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <rect x="104" y="66" width="82" height="38" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="145" y="54" font-size="20" fill="#1a1a1a" text-anchor="middle">data</text>
  <text x="145" y="92" font-size="20" fill="#1a1a1a" text-anchor="middle">next</text>

  <!-- 结点 2 -->
  <rect x="278" y="28" width="82" height="38" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <rect x="278" y="66" width="82" height="38" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="319" y="54" font-size="20" fill="#1a1a1a" text-anchor="middle">data</text>
  <text x="319" y="92" font-size="20" fill="#1a1a1a" text-anchor="middle">next</text>

  <!-- 结点 3 -->
  <rect x="452" y="28" width="82" height="38" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <rect x="452" y="66" width="82" height="38" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="493" y="54" font-size="20" fill="#1a1a1a" text-anchor="middle">data</text>
  <text x="493" y="92" font-size="20" fill="#1a1a1a" text-anchor="middle">next</text>

  <!-- 结点 4 -->
  <rect x="626" y="28" width="82" height="38" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <rect x="626" y="66" width="82" height="38" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="667" y="54" font-size="20" fill="#1a1a1a" text-anchor="middle">data</text>
  <text x="667" y="92" font-size="20" fill="#1a1a1a" text-anchor="middle">next</text>

  <!-- 结点 5 -->
  <rect x="800" y="28" width="82" height="38" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <rect x="800" y="66" width="82" height="38" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="841" y="54" font-size="20" fill="#1a1a1a" text-anchor="middle">data</text>
  <text x="841" y="92" font-size="20" fill="#1a1a1a" text-anchor="middle">next</text>

  <!-- 黑色 next 指针 -->
  <path d="M186,85.5 L278,85.5" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow-01-07)"/>
  <path d="M360,85.5 L452,85.5" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow-01-07)"/>
  <path d="M708,85.5 L800,85.5" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow-01-07)"/>
  <path d="M882,85.5 L941,85.5" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow-01-07)"/>

  <!-- 红色指针：第 3 个结点 -> 第 4 个结点 -->
  <path d="M535,85.5 L625,85.5" fill="none" stroke="#ff0000" stroke-width="1.6" marker-end="url(#arrow-01-07r)"/>

  <!-- 下方游离结点 -->
  <rect x="577" y="238" width="81" height="30" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <rect x="577" y="268" width="81" height="38" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="617" y="260" font-size="20" fill="#1a1a1a" text-anchor="middle">data</text>
  <text x="617" y="294" font-size="20" fill="#1a1a1a" text-anchor="middle">next</text>

  <!-- 被划掉的曲线：第 3 个结点 -> 游离结点 -->
  <path d="M535,88 C549,88 560,96 563,108 C566,120 555,133 505,141 C497,143 497,152 512,156
           C530,160 560,155 578,162 C592,168 598,178 598,190 C598,205 585,215 565,221
           C552,226 548,238 547,252 C546,268 552,281 566,285 C570,286 573,287 577,287"
        fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow-01-07)"/>

  <!-- 被划掉的曲线：游离结点 -> 第 4 个结点 -->
  <path d="M658,288 C674,288 688,282 691,270 C693,262 690,255 688,249
           C700,244 722,246 730,234 C736,224 737,212 733,196
           C730,180 716,168 700,164 C688,161 682,150 679,136 C678,126 677,116 677,106"
        fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow-01-07)"/>

  <!-- 红色叉号 -->
  <path d="M538,144 L558,168" fill="none" stroke="#ff0000" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M558,144 L538,168" fill="none" stroke="#ff0000" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M680,240 L696,260" fill="none" stroke="#ff0000" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M696,240 L680,260" fill="none" stroke="#ff0000" stroke-width="4.5" stroke-linecap="round"/>
</svg>
