<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1118 262" role="img" aria-label="一行四个单链表结点向右相连，红色箭头从下方独立的 data/next 结点指向第三个结点后面的指针" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" width="1118" height="262">
  <defs>
    <marker id="arrow-01-03" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrow-01-03r" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff0000"/>
    </marker>
  </defs>

  <!-- 结点 1 -->
  <rect x="150" y="28" width="81" height="39" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <rect x="150" y="67" width="81" height="39" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="190" y="54" font-size="20" fill="#1a1a1a" text-anchor="middle">data</text>
  <text x="190" y="92" font-size="20" fill="#1a1a1a" text-anchor="middle">next</text>

  <!-- 结点 2 -->
  <rect x="324" y="28" width="81" height="39" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <rect x="324" y="67" width="81" height="39" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="364" y="54" font-size="20" fill="#1a1a1a" text-anchor="middle">data</text>
  <text x="364" y="92" font-size="20" fill="#1a1a1a" text-anchor="middle">next</text>

  <!-- 结点 3 -->
  <rect x="498" y="28" width="81" height="39" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <rect x="498" y="67" width="81" height="39" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="538" y="54" font-size="20" fill="#1a1a1a" text-anchor="middle">data</text>
  <text x="538" y="92" font-size="20" fill="#1a1a1a" text-anchor="middle">next</text>

  <!-- 结点 4 -->
  <rect x="672" y="28" width="81" height="39" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <rect x="672" y="67" width="81" height="39" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="712" y="54" font-size="20" fill="#1a1a1a" text-anchor="middle">data</text>
  <text x="712" y="92" font-size="20" fill="#1a1a1a" text-anchor="middle">next</text>

  <!-- 结点 5 -->
  <rect x="846" y="28" width="81" height="39" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <rect x="846" y="67" width="81" height="39" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="886" y="54" font-size="20" fill="#1a1a1a" text-anchor="middle">data</text>
  <text x="886" y="92" font-size="20" fill="#1a1a1a" text-anchor="middle">next</text>

  <!-- next 指针 -->
  <path d="M231,85 L324,85" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow-01-03)"/>
  <path d="M405,85 L498,85" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow-01-03)"/>
  <path d="M579,85 L672,85" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow-01-03)"/>
  <path d="M753,85 L846,85" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow-01-03)"/>
  <path d="M927,85 L986,85" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow-01-03)"/>

  <!-- 下方独立结点 -->
  <rect x="623" y="172" width="81" height="39" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <rect x="623" y="211" width="81" height="39" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="663" y="198" font-size="20" fill="#1a1a1a" text-anchor="middle">data</text>
  <text x="663" y="236" font-size="20" fill="#1a1a1a" text-anchor="middle">next</text>

  <!-- 红色箭头：指向上面的指针线 -->
  <path d="M663,172 C663,156 661,143 655,137 C645,128 630,125 625,118 C622,112 622,100 622,90"
        fill="none" stroke="#ff0000" stroke-width="1.6" marker-end="url(#arrow-01-03r)"/>
</svg>
