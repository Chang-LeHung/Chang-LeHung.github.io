<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1106 127" role="img" aria-label="静态链表的五个结点，每个结点由 data 和 next 值两格组成，next 值用箭头指向下一个结点" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" width="1106" height="127">
  <defs>
    <marker id="arrow-01-13" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- 结点 1 -->
  <rect x="66" y="47" width="80" height="38" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <rect x="146" y="47" width="82" height="38" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="106" y="74" font-size="20" fill="#1a1a1a" text-anchor="middle">data</text>
  <text x="187" y="74" font-size="20" fill="#1a1a1a" text-anchor="middle">4</text>

  <!-- 结点 2 -->
  <rect x="271" y="47" width="81" height="38" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <rect x="352" y="47" width="82" height="38" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="311" y="74" font-size="20" fill="#1a1a1a" text-anchor="middle">data</text>
  <text x="393" y="74" font-size="20" fill="#1a1a1a" text-anchor="middle">1</text>

  <!-- 结点 3 -->
  <rect x="485" y="47" width="80" height="38" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <rect x="565" y="47" width="82" height="38" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="525" y="74" font-size="20" fill="#1a1a1a" text-anchor="middle">data</text>
  <text x="606" y="74" font-size="20" fill="#1a1a1a" text-anchor="middle">3</text>

  <!-- 结点 4 -->
  <rect x="707" y="47" width="80" height="38" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <rect x="787" y="47" width="81" height="38" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="747" y="74" font-size="20" fill="#1a1a1a" text-anchor="middle">data</text>
  <text x="827" y="74" font-size="20" fill="#1a1a1a" text-anchor="middle">2</text>

  <!-- 结点 5 -->
  <rect x="926" y="47" width="80" height="38" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <rect x="1006" y="47" width="81" height="38" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="966" y="74" font-size="20" fill="#1a1a1a" text-anchor="middle">data</text>
  <text x="1046" y="74" font-size="20" fill="#1a1a1a" text-anchor="middle">-1</text>

  <!-- 结点 1 -> 结点 2 -->
  <path d="M147,47 V26 Q147,17.5 156,17.5 H343 Q352,17.5 352,26 V47"
        fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow-01-13)"/>

  <!-- next = 3：指向结点 3 -->
  <path d="M352,85 V105 Q352,114 361,114 H556 Q565,114 565,105 V85"
        fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow-01-13)"/>

  <!-- next = 2：指向结点 4 -->
  <path d="M565,47 V26 Q565,17.5 574,17.5 H778 Q787,17.5 787,26 V47"
        fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow-01-13)"/>

  <!-- next = -1：指向结点 5 -->
  <path d="M787,85 V105 Q787,114 796,114 H997 Q1006,114 1006,105 V85"
        fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow-01-13)"/>
</svg>
