<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 962 378" role="img" aria-label="fib 数组从 0 到 13 自左向右依次计算，上方黑色箭头表示计算方向，六组彩色箭头分别标出每个新值所依赖的两个旧值" font-family="Seaford, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#000" width="962" height="378">
  <defs>
    <marker id="arrow-dp11-black" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="9.5" markerHeight="9.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <marker id="arrow-dp11-yellow" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cccc00"/>
    </marker>
    <marker id="arrow-dp11-red" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff3333"/>
    </marker>
    <marker id="arrow-dp11-magenta1" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cc00cc"/>
    </marker>
    <marker id="arrow-dp11-magenta2" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff66ff"/>
    </marker>
    <marker id="arrow-dp11-magenta3" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff33ff"/>
    </marker>
    <marker id="arrow-dp11-green" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#009900"/>
    </marker>
  </defs>

  <text x="323" y="62" font-size="32">从左至右计算 fib 数组</text>

  <line x1="327" y1="91.5" x2="646" y2="91.5" stroke="#000" stroke-width="3.5"
        marker-end="url(#arrow-dp11-black)"/>

  <g fill="none" stroke-width="2.6">
    <g stroke="#cccc00">
      <path d="M 403 175 V 123 H 214 V 175" marker-end="url(#arrow-dp11-yellow)"/>
      <path d="M 285 123 V 175" marker-end="url(#arrow-dp11-yellow)"/>
    </g>
    <g stroke="#ff3333">
      <path d="M 592 175 V 123 H 427 V 175" marker-end="url(#arrow-dp11-red)"/>
      <path d="M 474 123 V 175" marker-end="url(#arrow-dp11-red)"/>
    </g>
    <g stroke="#cc00cc">
      <path d="M 781 175 V 123 H 616 V 175" marker-end="url(#arrow-dp11-magenta1)"/>
      <path d="M 663 123 V 175" marker-end="url(#arrow-dp11-magenta1)"/>
    </g>
    <g stroke="#ff66ff">
      <path d="M 498 216 V 267.5 H 309 V 216" marker-end="url(#arrow-dp11-magenta2)"/>
      <path d="M 379.5 267.5 V 216" marker-end="url(#arrow-dp11-magenta2)"/>
    </g>
    <g stroke="#009900">
      <path d="M 686.5 216 V 267.5 H 521 V 216" marker-end="url(#arrow-dp11-green)"/>
      <path d="M 568.5 267.5 V 216" marker-end="url(#arrow-dp11-green)"/>
    </g>
    <g stroke="#ff33ff">
      <path d="M 875.5 216 V 267.5 H 710.5 V 216" marker-end="url(#arrow-dp11-magenta3)"/>
      <path d="M 757.5 267.5 V 216" marker-end="url(#arrow-dp11-magenta3)"/>
    </g>
  </g>

  <text x="24" y="209" font-size="37">fib 数组</text>

  <g stroke="#000" stroke-width="2" fill="none">
    <rect x="167" y="175.5" width="756" height="40.5"/>
    <line x1="261" y1="176" x2="261" y2="215.5"/>
    <line x1="356" y1="176" x2="356" y2="215.5"/>
    <line x1="450" y1="176" x2="450" y2="215.5"/>
    <line x1="545" y1="176" x2="545" y2="215.5"/>
    <line x1="639" y1="176" x2="639" y2="215.5"/>
    <line x1="734" y1="176" x2="734" y2="215.5"/>
    <line x1="828" y1="176" x2="828" y2="215.5"/>
  </g>

  <g font-size="37" text-anchor="middle">
    <text x="214" y="209">0</text>
    <text x="307.5" y="209">1</text>
    <text x="401.5" y="209">1</text>
    <text x="497.5" y="209">2</text>
    <text x="592" y="209">3</text>
    <text x="687" y="209">5</text>
    <text x="781.5" y="209">8</text>
    <text x="877" y="209">13</text>
  </g>

  <text x="323" y="330" font-size="32">彩色箭头表示数据依赖情况</text>
</svg>
