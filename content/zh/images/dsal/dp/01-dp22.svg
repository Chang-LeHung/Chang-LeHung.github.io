<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1049 404" role="img" aria-label="dp 表格中 (i, j) 单元格向左累加同一行前面各列的数据，右侧为图例说明" font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" width="1049" height="404">
  <defs>
    <marker id="arrow-dp22" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff0000"/>
    </marker>
    <marker id="arrow-dp22b" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="5.75" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1049" height="404" fill="#ffffff"/>

  <!-- 着色单元格 -->
  <rect x="49.5" y="188.5" width="261" height="27.5" fill="#fad7ac"/>
  <rect x="310.5" y="188.5" width="65" height="27.5" fill="#cdeb8b"/>
  <rect x="310.5" y="216" width="65" height="27.5" fill="#b1ddf0"/>

  <!-- 表格线 -->
  <g fill="none" stroke="#000000" stroke-width="1">
    <path d="M 49.5 107.5 H 571.5 M 49.5 134.5 H 571.5 M 49.5 161.5 H 571.5
             M 49.5 188.5 H 571.5 M 49.5 216 H 571.5 M 49.5 243.5 H 571.5
             M 49.5 270.5 H 571.5 M 49.5 297.5 H 571.5 M 49.5 325 H 571.5
             M 49.5 352 H 571.5"/>
    <path d="M 49.5 107.5 V 352 M 114.5 107.5 V 352 M 180 107.5 V 352
             M 245 107.5 V 352 M 310.5 107.5 V 352 M 375.5 107.5 V 352
             M 441 107.5 V 352 M 506 107.5 V 352 M 571.5 107.5 V 352"/>
  </g>

  <!-- 依赖箭头（红色） -->
  <g fill="none" stroke="#ff0000" stroke-width="1.5" stroke-dasharray="4 7">
    <path d="M 186.5 66 V 144 H 212.5 V 190" marker-end="url(#arrow-dp22)"/>
    <path d="M 82 114 H 278"/>
    <path d="M 82 114 V 190" marker-end="url(#arrow-dp22)"/>
    <path d="M 147.5 114 V 190" marker-end="url(#arrow-dp22)"/>
    <path d="M 278 114 V 190" marker-end="url(#arrow-dp22)"/>
  </g>
  <path d="M 396.5 64 V 114 H 343 V 190" fill="none" stroke="#ff0000"
        stroke-width="1.5" marker-end="url(#arrow-dp22)"/>

  <!-- 两个来源标注框 -->
  <rect x="113" y="33" width="147" height="33" rx="8" fill="#ffcc99" stroke="#333333" stroke-width="1.5"/>
  <text x="186.5" y="58.5" font-size="18.7" fill="#000000" text-anchor="middle">dp[i - 1][j - w]</text>
  <rect x="332" y="33" width="129" height="31" rx="8" fill="#cdeb8b" stroke="#333333" stroke-width="1.5"/>
  <text x="396.5" y="58.5" font-size="18.7" fill="#000000" text-anchor="middle">dp[i - 1][j]</text>

  <!-- 横向累加箭头 -->
  <path d="M 571.5 229.5 H 49" fill="none" stroke="#000000" stroke-width="4"
        stroke-dasharray="12 10" marker-end="url(#arrow-dp22b)"/>
  <text x="349" y="238.5" font-size="23" letter-spacing="1.5" fill="#000000" text-anchor="middle">(i, j)</text>

  <!-- 图例 -->
  <rect x="608" y="113" width="61" height="23" fill="#cce5ff" stroke="#333333" stroke-width="1"/>
  <rect x="608" y="178" width="61" height="24" fill="#ffcc99" stroke="#333333" stroke-width="1"/>
  <rect x="608" y="240" width="61" height="23" fill="#cdeb8b" stroke="#333333" stroke-width="1"/>

  <text x="699" y="135" font-size="25" fill="#000000">表示待计算的数据</text>
  <text x="703" y="197" font-size="25" fill="#000000">表示绿色框可能依赖的数据</text>
  <text x="708" y="261" font-size="25" fill="#000000">表示蓝色框依赖的数据</text>
  <text x="712" y="309" font-size="25" fill="#000000">表示被依赖的数据</text>
  <text x="713" y="354" font-size="25" fill="#000000">表示可能被依赖的数据</text>

  <path d="M 607 299.5 H 673" fill="none" stroke="#ff0000" stroke-width="2" marker-end="url(#arrow-dp22)"/>
  <path d="M 607 343.5 H 674" fill="none" stroke="#ff0000" stroke-width="2"
        stroke-dasharray="4 7" marker-end="url(#arrow-dp22)"/>
</svg>
