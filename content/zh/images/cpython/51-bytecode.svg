<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1036 754" role="img" aria-label="装饰器与栈的关系：decorator 函数自栈顶向下进入栈，需要时再入栈、出栈" font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif" width="1036" height="754">
  <defs>
    <marker id="arrow-51-bytecode" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- 栈外的 decorator 函数 -->
  <rect x="167" y="12" width="179" height="88" fill="none" stroke="#444" stroke-width="1.5"/>
  <text x="175" y="67" font-size="27">decorator 函数</text>

  <!-- 栈顶 / 栈底方向 -->
  <text x="68" y="148" font-size="27">栈顶</text>
  <text x="68" y="702" font-size="27">栈底</text>
  <path d="M93 665 V172" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow-51-bytecode)"/>

  <!-- 左侧栈：函数自栈顶向栈底进入 -->
  <rect x="166" y="133" width="179" height="577" fill="none" stroke="#444" stroke-width="1.5"/>
  <path d="M244 308 H265 V477 H295 L257 529 L220 477 H244 Z" fill="none" stroke="#444" stroke-width="1.5"/>

  <!-- 指向右侧的栈 -->
  <path d="M396 479 H536 V455 L575 490 L536 525 V502 H396 Z" fill="none" stroke="#444" stroke-width="1.5"/>

  <!-- 右侧栈：函数已经在栈里 -->
  <rect x="596" y="133" width="180" height="577" fill="none" stroke="#444" stroke-width="1.5"/>
  <line x1="596" y1="621" x2="776" y2="621" stroke="#444" stroke-width="1.5"/>
  <text x="604" y="676" font-size="27">decorator 函数</text>

  <!-- 入栈 / 出栈 -->
  <path d="M839 142 L873 183 H849 V240 H827 V183 H805 Z" fill="none" stroke="#444" stroke-width="1.5"/>
  <text x="927" y="196" font-size="27">入栈</text>
  <path d="M827 297 H849 V340 H873 L839 378 L803 340 H827 Z" fill="none" stroke="#444" stroke-width="1.5"/>
  <text x="937" y="331" font-size="27">出栈</text>
</svg>
