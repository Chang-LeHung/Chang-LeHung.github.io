<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 607 320" role="img" aria-label="三种颜色的对象相加后得到新对象，栈底的临时对象指向内存里的三个整数对象" font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif" width="607" height="320">
  <defs>
    <marker id="arrow-44codeobject" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- 顶部的算式：三种对象相加得到一个结果 -->
  <rect x="120" y="19" width="75" height="31" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
  <rect x="261" y="19" width="75" height="31" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <rect x="403" y="19" width="75" height="31" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <text x="227" y="43" font-size="20" text-anchor="middle">+</text>
  <text x="369" y="43" font-size="20" text-anchor="middle">=</text>

  <!-- 栈：栈底是一个红色临时对象 -->
  <text x="18" y="95" font-size="17">栈顶</text>
  <path d="M31 272 V 104" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow-44codeobject)"/>
  <text x="18" y="305" font-size="17">栈底</text>
  <rect x="75" y="79" width="75" height="206" fill="none" stroke="#444" stroke-width="1.5"/>
  <rect x="75" y="250" width="75" height="35" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <circle cx="110" cy="268" r="3.5" fill="#1a1a1a"/>

  <!-- 内存 -->
  <rect x="341" y="139" width="238" height="146" rx="22" fill="none" stroke="#444" stroke-width="1.5"/>
  <g fill="#dbe7fb" stroke="#6c8ebf" stroke-width="1.5">
    <rect x="364" y="152" width="60" height="31"/>
    <rect x="450" y="191" width="60" height="31"/>
    <rect x="375" y="235" width="60" height="31"/>
  </g>
  <g font-size="17" text-anchor="middle">
    <text x="394" y="174">1</text>
    <text x="480" y="213">2</text>
    <text x="405" y="257">3</text>
  </g>
  <text x="523" y="176" font-size="17">内存</text>

  <!-- 栈底对象指向内存里的对象 -->
  <path d="M120 268 H 245 V 240 H 368" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow-44codeobject)"/>
</svg>
