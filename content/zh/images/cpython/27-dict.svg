<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 561 701" role="img"
     aria-label="PyDictObject 与 PyDictKeyEntry：ob_refcnt 与 ob_type 组成 PyObject，ma_keys 指向由 dk_refcnt、dk_size、dk_usable 和 dk_entries 数组组成的键表"
     font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif">
  <defs>
    <marker id="arrow-27-dict" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <text x="75" y="20" font-size="18">PyDictObject</text>

  <!-- PyDictObject -->
  <g stroke-width="1.5">
    <rect x="28" y="39" width="193" height="50" fill="#dae8fc" stroke="#6c8ebf"/>
    <rect x="28" y="89" width="193" height="50" fill="#dae8fc" stroke="#6c8ebf"/>
    <rect x="28" y="139" width="193" height="50" fill="#d5e8d4" stroke="#82b366"/>
    <rect x="28" y="189" width="193" height="84" fill="#d5e8d4" stroke="#82b366"/>
    <rect x="28" y="273" width="193" height="67" fill="#d5e8d4" stroke="#82b366"/>
  </g>
  <g font-size="18">
    <text x="38" y="71">Py_ssize_t ob_refcnt</text>
    <text x="38" y="121">_typeobject *ob_type</text>
    <text x="38" y="171">Py_ssize_t ma_used</text>
    <text x="38" y="227">PyDictKeysObject</text>
    <text x="38" y="249">*ma_keys</text>
    <text x="38" y="314">PyObject **ma_values</text>
  </g>

  <!-- PyObject 花括号 -->
  <path d="M265 39 q-22 0 -22 24 v26 q0 20 -16 22 q16 2 16 22 v26 q0 24 22 24"
        fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="320" y="95" font-size="18">PyObject</text>

  <!-- PyDictKeyEntry -->
  <text x="390" y="263" font-size="18">PyDictKeyEntry</text>
  <g stroke-width="1.5">
    <rect x="334" y="281" width="190" height="50" fill="#e1d5e7" stroke="#9673a6"/>
    <rect x="334" y="331" width="190" height="50" fill="#e1d5e7" stroke="#9673a6"/>
    <rect x="334" y="381" width="190" height="50" fill="#e1d5e7" stroke="#9673a6"/>
    <rect x="334" y="431" width="190" height="50" fill="#f8cecc" stroke="#b85450"/>
    <rect x="334" y="481" width="190" height="50" fill="#f8cecc" stroke="#b85450"/>
    <rect x="334" y="531" width="190" height="50" fill="#f8cecc" stroke="#b85450"/>
    <rect x="334" y="581" width="190" height="50" fill="#f8cecc" stroke="#b85450"/>
    <rect x="334" y="631" width="190" height="50" fill="#f8cecc" stroke="#b85450"/>
  </g>
  <g font-size="18">
    <text x="346" y="313">Py_ssize_t dk_refcnt</text>
    <text x="346" y="363">Py_ssize_t dk_size</text>
    <text x="346" y="413">Py_ssize_t dk_usable</text>
  </g>
  <g font-size="18" text-anchor="middle">
    <text x="429" y="463">dk_entries[1]</text>
    <text x="429" y="513">dk_entries[2]</text>
    <text x="429" y="563">dk_entries[3]</text>
    <text x="429" y="613">dk_entries[4]</text>
    <text x="429" y="663">......</text>
  </g>

  <path d="M221 228 C 280 228 300 250 328 274" fill="none" stroke="#444" stroke-width="1.5"
        marker-end="url(#arrow-27-dict)"/>
</svg>
