<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 181 256" role="img" aria-label="执行栈里压着全局变量 counter 的值 26，下方是局部变量 a" font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif" width="181" height="256">
  <defs>
    <marker id="arrow-62bytecode" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <text x="88" y="28" font-size="19" text-anchor="middle">counter = 26</text>

  <!-- 栈的增长方向 -->
  <path d="M27 220 V 50" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow-62bytecode)"/>
  <text x="13" y="228" font-size="15">栈底</text>

  <!-- 栈：顶部空闲，往下依次是 1 与 a = 1 -->
  <rect x="62" y="52" width="86" height="181" fill="none" stroke="#444" stroke-width="1.5"/>
  <line x1="62" y1="170" x2="148" y2="170" stroke="#444" stroke-width="1.5"/>
  <line x1="62" y1="202" x2="148" y2="202" stroke="#444" stroke-width="1.5"/>
  <text x="105" y="192" font-size="16" text-anchor="middle">1</text>
  <text x="105" y="223" font-size="16" text-anchor="middle">a = 1</text>
</svg>
