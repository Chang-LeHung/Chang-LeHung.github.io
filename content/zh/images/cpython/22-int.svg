<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1354 648" role="img"
     aria-label="PyLongObject 的内存布局：ob_refcnt 与 ob_type 组成 PyObject，ob_refcnt、ob_type、ob_size 组成 PyVarObject，ob_digit 指向按位存放数值的数组"
     font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif">
  <defs>
    <marker id="arrow-22-int" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <text x="548" y="64" font-size="36" text-anchor="middle">PyLongObject</text>

  <!-- 结构体：四个字段 -->
  <g stroke-width="1.5">
    <rect x="355" y="97" width="386" height="100" fill="#dae8fc" stroke="#6c8ebf"/>
    <rect x="355" y="197" width="386" height="100" fill="#dae8fc" stroke="#6c8ebf"/>
    <rect x="355" y="297" width="386" height="100" fill="#d5e8d4" stroke="#82b366"/>
    <rect x="355" y="397" width="386" height="100" fill="#fff2cc" stroke="#d6b656"/>
  </g>
  <g font-size="34" text-anchor="middle">
    <text x="548" y="160">Py_ssize_t ob_refcnt</text>
    <text x="548" y="260">_typeobject *ob_type</text>
    <text x="548" y="360">Py_ssize_t ob_size</text>
    <text x="548" y="460">digit ob_digit[1];</text>
  </g>

  <!-- PyVarObject 花括号 -->
  <path d="M300 96 q-22 0 -22 24 v102 q0 20 -16 22 q16 2 16 22 v102 q0 24 22 24"
        fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="250" y="258" font-size="34" text-anchor="end">PyVarObject</text>

  <!-- PyObject 花括号 -->
  <path d="M820 98 q-22 0 -22 24 v54 q0 20 -16 22 q16 2 16 22 v54 q0 24 22 24"
        fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="890" y="210" font-size="34">PyObject</text>

  <!-- ob_digit 指向的数组 -->
  <g stroke-width="1.5">
    <rect x="1005" y="297" width="266" height="76" fill="#f8cecc" stroke="#b85450"/>
    <rect x="1005" y="373" width="266" height="76" fill="#f8cecc" stroke="#b85450"/>
    <rect x="1005" y="449" width="266" height="72" fill="#f8cecc" stroke="#b85450"/>
    <rect x="1005" y="521" width="266" height="76" fill="#f8cecc" stroke="#b85450"/>
  </g>
  <g font-size="34" text-anchor="middle">
    <text x="1138" y="348">ob_digit[0]</text>
    <text x="1138" y="424">ob_digit[1]</text>
    <text x="1138" y="498">...</text>
    <text x="1138" y="572">ob_digit[size-1]</text>
  </g>
  <path d="M968 295 q-22 0 -22 24 v109 q0 20 -16 22 q16 2 16 22 v109 q0 24 22 24"
        fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <path d="M741 450 H934" fill="none" stroke="#444" stroke-width="1.5"
        marker-end="url(#arrow-22-int)"/>
</svg>
