  <g fill="#d5e8d4" stroke="#82b366" stroke-width="1.5">
    <rect x="913" y="89" width="93" height="39.5"/>
    <rect x="913" y="128.5" width="93" height="39.5"/>
    <rect x="913" y="168" width="93" height="39.5"/>
    <rect x="913" y="207.5" width="93" height="39.5"/>
