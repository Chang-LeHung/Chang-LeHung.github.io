  <g font-size="16">
    <text x="921" y="115">PyObject*</text>
    <text x="921" y="155">PyObject*</text>
    <text x="921" y="194">PyObject*</text>
    <text x="921" y="234">PyObject*</text>
  </g>

  <g fill="#b0e3e6" stroke="#0e8088" stroke-width="1.5">
    <rect x="1081" y="86" width="191" height="32"/>
    <rect x="1081" y="118" width="191" height="32"/>
    <rect x="1081" y="150" width="191" height="32"/>
    <rect x="1081" y="182" width="191" height="32"/>
    <rect x="1081" y="214" width="191" height="32"/>
  </g>
  <g font-size="16">
    <text x="1092" y="108">Py_ssize_t ob_refcnt</text>
    <text x="1092" y="140">_typeobject *ob_type</text>
    <text x="1092" y="172">Py_ssize_t ob_size</text>
    <text x="1092" y="204">PyObject **ob_item;</text>
    <text x="1092" y="236">Py_ssize_t allocated</text>
  </g>

  <g fill="#ffffff" stroke="#444" stroke-width="1.5">
    <rect x="703" y="31" width="72" height="38"/>
    <rect x="703" y="96" width="72" height="38"/>
    <rect x="703" y="175" width="72" height="38"/>
    <rect x="703" y="248" width="72" height="38"/>
  </g>
  <g font-size="16" text-anchor="middle">
    <text x="739" y="56">1</text>
    <text x="739" y="121">2</text>
    <text x="739" y="200">[1, 2]</text>
    <text x="739" y="273">(1,2)</text>
  </g>

  <g fill="none" stroke="#444" stroke-width="1.5">
    <path d="M1081 100 H1044 V67 H1007 V86" marker-end="url(#arrow-08-list)"/>
    <path d="M913 108 H843 V50 H777" marker-end="url(#arrow-08-list)"/>
    <path d="M913 148 H737 V134" marker-end="url(#arrow-08-list)"/>
    <path d="M913 188 H840 V182 H777" marker-end="url(#arrow-08-list)"/>
    <path d="M913 229 H843 V266 H777" marker-end="url(#arrow-08-list)"/>
