<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 660" role="img" aria-label="free_list 缓存池：左侧三个元组对象从数组下标 10 起串起来，新的元组对象要加入 free_list；右侧新对象先指向原表头，表头再挂到数组上" font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif" width="1560" height="660">
  <defs>
    <marker id="arrow-11tuple" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- 左：数组下标 10/11/12 指向三个 PyTupleObject -->
  <g stroke="#82b366" stroke-width="1.5" fill="#d5e8d4">
    <rect x="152" y="64" width="222" height="61"/>
    <rect x="152" y="174" width="222" height="62"/>
    <rect x="152" y="282" width="222" height="62"/>
  </g>
  <g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arrow-11tuple)">
    <path d="M263 174 V125"/>
    <path d="M263 282 V236"/>
    <path d="M210 478 V411 H263 V344"/>
  </g>
  <g font-size="27" text-anchor="middle">
    <text x="263" y="103">PyTupleObject</text>
    <text x="263" y="213">PyTupleObject</text>
    <text x="263" y="321">PyTupleObject</text>
  </g>

  <!-- 数组：表头 + 下标 -->
  <g stroke="#b85450" stroke-width="1.5" fill="#f8cecc">
    <rect x="144" y="476" width="132" height="56"/>
    <rect x="276" y="476" width="132" height="56"/>
    <rect x="408" y="476" width="132" height="56"/>
  </g>
  <g stroke="#444" stroke-width="1.5" fill="#ffffff">
    <rect x="144" y="532" width="132" height="56"/>
    <rect x="276" y="532" width="132" height="56"/>
    <rect x="408" y="532" width="132" height="56"/>
  </g>
  <g font-size="27" text-anchor="middle">
    <text x="210" y="514">PyObject*</text>
    <text x="342" y="514">PyObject*</text>
    <text x="474" y="514">PyObject*</text>
    <text x="210" y="570">10</text>
    <text x="342" y="570">11</text>
    <text x="474" y="570">12</text>
  </g>
  <text x="20" y="569" font-size="25">数组下标</text>

  <!-- 中间说明与待加入 free_list 的对象 -->
  <text x="654" y="256" font-size="26" text-anchor="middle">最新需要加入到 free_list 当中的元组数据</text>
  <rect x="449" y="283" width="222" height="67" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="560" y="325" font-size="27" text-anchor="middle">PyTupleObject</text>

  <!-- 左右两图之间的箭头 -->
  <path d="M712 398 H866 V384 L893 405 L866 426 V412 H712 Z" fill="#ffffff" stroke="#444" stroke-width="1.5"/>

  <!-- 右：新对象插到表头，表头再写入数组 -->
  <g stroke="#82b366" stroke-width="1.5" fill="#d5e8d4">
    <rect x="1014" y="60" width="222" height="61"/>
    <rect x="1014" y="170" width="222" height="62"/>
    <rect x="1014" y="278" width="222" height="61"/>
  </g>
  <g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arrow-11tuple)">
    <path d="M1125 170 V121"/>
    <path d="M1125 278 V232"/>
    <path d="M1075 476 V410 H1422 V350"/>
    <path d="M1312 316 H1236"/>
  </g>
  <g font-size="27" text-anchor="middle">
    <text x="1125" y="99">PyTupleObject</text>
    <text x="1125" y="209">PyTupleObject</text>
    <text x="1125" y="316">PyTupleObject</text>
  </g>

  <!-- 右侧数组 -->
  <g stroke="#b85450" stroke-width="1.5" fill="#f8cecc">
    <rect x="1006" y="476" width="132" height="56"/>
    <rect x="1138" y="476" width="132" height="56"/>
    <rect x="1270" y="476" width="132" height="56"/>
  </g>
  <g stroke="#444" stroke-width="1.5" fill="#ffffff">
    <rect x="1006" y="532" width="132" height="56"/>
    <rect x="1138" y="532" width="132" height="56"/>
    <rect x="1270" y="532" width="132" height="56"/>
  </g>
  <g font-size="27" text-anchor="middle">
    <text x="1072" y="514">PyObject*</text>
    <text x="1204" y="514">PyObject*</text>
    <text x="1336" y="514">PyObject*</text>
    <text x="1072" y="570">10</text>
    <text x="1204" y="570">11</text>
    <text x="1336" y="570">12</text>
  </g>

  <rect x="1312" y="283" width="222" height="67" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="1423" y="325" font-size="27" text-anchor="middle">PyTupleObject</text>
</svg>
