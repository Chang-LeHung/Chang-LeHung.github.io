<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 629 272" role="img"
     aria-label="栈上的两个格子各自保存指向 code 对象的指针，分别指向内存里编号 1 和 2 的 code 对象"
     font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif">
  <defs>
    <marker id="arrow-43-codeobject" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- 调用栈 -->
  <rect x="85" y="26" width="77" height="144" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <rect x="85" y="170" width="77" height="35" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <rect x="85" y="205" width="77" height="30" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
  <text x="24" y="25" font-size="16">栈顶</text>
  <text x="24" y="238" font-size="16">栈底</text>
  <path d="M41 215 V38" fill="none" stroke="#444" stroke-width="1.5"
        marker-end="url(#arrow-43-codeobject)"/>

  <!-- 内存 -->
  <rect x="366" y="86" width="225" height="148" rx="18" fill="#ffffff" stroke="#444" stroke-width="1.5"/>
  <text x="540" y="121" font-size="16">内存</text>
  <rect x="386" y="105" width="62" height="34" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <rect x="388" y="156" width="62" height="34" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="417" y="128" font-size="16" text-anchor="middle">1</text>
  <text x="419" y="179" font-size="16" text-anchor="middle">2</text>

  <!-- 两个栈格里的指针 -->
  <circle cx="122" cy="188" r="4" fill="#444"/>
  <circle cx="124" cy="219" r="4" fill="#444"/>
  <g fill="none" stroke="#444" stroke-width="1.5">
    <path d="M122 188 H225 V107 H382" marker-end="url(#arrow-43-codeobject)"/>
    <path d="M124 219 H265 V158 H384" marker-end="url(#arrow-43-codeobject)"/>
  </g>
</svg>
