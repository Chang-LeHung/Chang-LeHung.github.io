  <path d="M373 96 V297 H246" fill="none" stroke="#444" stroke-width="1.5"
        marker-end="url(#arrow-46-bytecode)"/>
  <path d="M575 96 V258" fill="none" stroke="#444" stroke-width="1.5"
        marker-end="url(#arrow-46-bytecode)"/>
  <path d="M777 96 V177 H958 V258" fill="none" stroke="#444" stroke-width="1.5"
        marker-end="url(#arrow-46-bytecode)"/>

  <g font-size="35">
    <text x="27" y="297">LOAD_FAST</text>
    <text x="486" y="296">BINARY_ADD</text>
    <text x="834" y="296">RETURN_VALUE</text>
  </g>
</svg>
