<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1138 276" role="img" aria-label="ob_size 为 2 的整数：ob_digit 指向两块按 30 位拆分的数字位" font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif" width="1138" height="276">
  <defs>
    <marker id="arrow-18int" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- 左侧：ob_size 与 ob_digit -->
  <rect x="41" y="21" width="219" height="85" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <rect x="41" y="106" width="219" height="85" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <g font-size="20" text-anchor="middle">
    <text x="151" y="72">ob_size = 2</text>
    <text x="151" y="157">ob_digit</text>
  </g>

  <!-- 右侧：两块数字位 -->
  <rect x="407" y="103" width="678" height="65" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <rect x="407" y="168" width="678" height="64" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <g font-size="30" text-anchor="middle">
    <text x="746" y="145">0011 1111 1111 1111 1111 1111 1111 1111</text>
    <text x="746" y="209">0000 0000 0000 0000 0000 0000 0000 0100</text>
  </g>

  <!-- ob_digit 指向第一块数字位 -->
  <path d="M260 148 H 320 V 100 H 402" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow-18int)"/>
</svg>
