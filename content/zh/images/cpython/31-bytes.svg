<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1046 908" role="img" aria-label="PyDictObject 与 PyDictKeyEntry 的内存布局：ma_keys 指向右侧的键表，键表由 dk_refcnt、dk_size、dk_usable 和 dk_entries 数组组成" font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif" width="1046" height="908">
  <defs>
    <marker id="arrow-31-bytes" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <text x="186" y="154" font-size="28" text-anchor="middle">PyDictObject</text>
  <text x="835" y="62" font-size="28" text-anchor="middle">PyDictKeyEntry</text>

  <!-- 左侧：PyDictObject -->
  <g stroke-width="1.5">
    <rect x="50" y="180" width="271" height="70" fill="#dde8fa" stroke="#6c8ebf"/>
    <rect x="50" y="250" width="271" height="70" fill="#dde8fa" stroke="#6c8ebf"/>
    <rect x="50" y="320" width="271" height="70" fill="#d9e7d6" stroke="#82b366"/>
    <rect x="50" y="390" width="271" height="117" fill="#d9e7d6" stroke="#82b366"/>
    <rect x="50" y="507" width="271" height="93" fill="#d9e7d6" stroke="#82b366"/>
  </g>

  <g font-size="29" text-anchor="middle">
    <text x="186" y="226">Py_ssize_t ob_refcnt</text>
    <text x="186" y="296">_typeobject *ob_type</text>
    <text x="186" y="366">Py_ssize_t ma_used</text>
    <text x="186" y="444">PyDictKeysObject</text>
    <text x="186" y="476">*ma_keys</text>
    <text x="186" y="571">PyObject **ma_values</text>
  </g>

  <!-- 花括号 + PyObject -->
  <path d="M350 179 q14 0 14 14 v40 q0 10 9 12 q-9 2 -9 12 v39 q0 14 -14 14"
        fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="425" y="257" font-size="27">PyObject</text>

  <!-- 右侧：PyDictKeyEntry -->
  <g stroke-width="1.5">
    <rect x="697" y="85" width="271" height="70" fill="#dfd5e6" stroke="#9673a6"/>
    <rect x="697" y="155" width="271" height="70" fill="#dfd5e6" stroke="#9673a6"/>
    <rect x="697" y="225" width="271" height="70" fill="#dfd5e6" stroke="#9673a6"/>
    <rect x="697" y="295" width="271" height="70" fill="#f1d0cd" stroke="#b85450"/>
    <rect x="697" y="365" width="271" height="70" fill="#f1d0cd" stroke="#b85450"/>
    <rect x="697" y="435" width="271" height="70" fill="#f1d0cd" stroke="#b85450"/>
    <rect x="697" y="505" width="271" height="70" fill="#f1d0cd" stroke="#b85450"/>
    <rect x="697" y="575" width="271" height="70" fill="#f1d0cd" stroke="#b85450"/>
    <rect x="697" y="645" width="271" height="70" fill="#f1d0cd" stroke="#b85450"/>
    <rect x="697" y="715" width="271" height="70" fill="#f1d0cd" stroke="#b85450"/>
    <rect x="697" y="785" width="271" height="69" fill="#f1d0cd" stroke="#b85450"/>
  </g>

  <g font-size="29" text-anchor="middle">
    <text x="832" y="131">Py_ssize_t dk_refcnt</text>
    <text x="832" y="201">Py_ssize_t dk_size</text>
    <text x="832" y="271">Py_ssize_t dk_usable</text>
    <text x="832" y="341">dk_entries[0]</text>
    <text x="832" y="411">dk_entries[1]</text>
    <text x="832" y="481">dk_entries[2]</text>
    <text x="832" y="551">dk_entries[3]</text>
    <text x="832" y="621">dk_entries[4]</text>
    <text x="832" y="691">dk_entries[5]</text>
    <text x="832" y="761">dk_entries[6]</text>
    <text x="832" y="831">dk_entries[7]</text>
  </g>

  <!-- ma_keys 指向键表 -->
  <path d="M321 448 H573 V89 H689" fill="none" stroke="#444" stroke-width="1.5"
        marker-end="url(#arrow-31-bytes)"/>
</svg>
