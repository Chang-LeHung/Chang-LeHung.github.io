<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 623 454" role="img" aria-label="优先级图：scrollable-pane 与 editable-pane 指向 pane，editable-scrollable-pane 指向两者，另有 scrolling-mixin 与 editing-mixin；图注说明 Dylan 的线性化不遵循扩展优先级图" font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif" width="623" height="454">
  <defs>
    <marker id="arrow-81" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7.5" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- 箭头：先画线，标签覆盖在上面 -->
  <g fill="none" stroke="#444" stroke-width="1.5">
    <path d="M122 238 C92 228 66 205 66 172 C66 104 226 82 249 68"
          marker-end="url(#arrow-81)"/>
    <path d="M382 238 L274 72" marker-end="url(#arrow-81)"/>
    <path d="M144 238 L215 165" marker-end="url(#arrow-81)"/>
    <path d="M403 238 L475 165" marker-end="url(#arrow-81)"/>
    <path d="M257 336 L186 264" marker-end="url(#arrow-81)"/>
    <path d="M280 336 L350 264" marker-end="url(#arrow-81)"/>
  </g>

  <g fill="#1a1a1a" font-size="21" text-anchor="middle"
     font-family="Menlo, 'Courier New', Courier, monospace">
    <text x="263" y="63">&lt;pane&gt;</text>
    <text x="197.5" y="159">&lt;scrolling-mixin&gt;</text>
    <text x="457.5" y="159">&lt;editing-mixin&gt;</text>
    <text x="133" y="259">&lt;scrollable-pane&gt;</text>
    <text x="392.5" y="259">&lt;editable-pane&gt;</text>
    <text x="263" y="356">&lt;editable-scrollable-pane&gt;</text>
  </g>

  <g fill="#1a1a1a" font-size="24" font-style="italic" text-anchor="middle">
    <text x="292.5" y="389">Figure 5: A heterarchy where Dylan's linearization</text>
    <text x="292" y="419">does not observe the extended precedence graph</text>
  </g>
</svg>
