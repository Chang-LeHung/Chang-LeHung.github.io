<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 352" role="img" aria-label="栈里放着一个 rangeobject：蓝色区域是空余的栈空间，箭头表示自栈底向上的方向" font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif" width="470" height="352">
  <defs>
    <marker id="arrow-66-bytecode" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- 栈：上蓝下粉 -->
  <rect x="162" y="46" width="196" height="176" fill="#dde8fa" stroke="#738dbb" stroke-width="1.5"/>
  <rect x="162" y="222" width="196" height="73" fill="#f1d0cd" stroke="#ac5a54" stroke-width="1.5"/>
  <text x="260" y="272" font-size="36" text-anchor="middle">rangeobject</text>

  <!-- 栈底与向上的箭头 -->
  <text x="76" y="285" font-size="29">栈底</text>
  <path d="M102 244 V44" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow-66-bytecode)"/>
</svg>
