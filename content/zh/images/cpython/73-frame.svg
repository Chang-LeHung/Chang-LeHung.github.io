<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1408 684" role="img" aria-label="foo() 的 FrameObject 与 f_globals、f_builtins、f_locals、f_valuestack、f_code 的指向关系，右侧是 foo 的字节码" font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif">
