<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1124 320" role="img" aria-label="PyLongObject 中 ob_size = -2 与 ob_digit 的关系，以及 ob_digit 里 32 位一组的二进制内容" font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif">
  <defs>
    <marker id="arrow-int" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <g stroke-width="1.5">
    <rect x="35" y="40" width="216" height="81" fill="#d9e7d6" stroke="#8cb26e"/>
    <rect x="35" y="125" width="216" height="81" fill="#fdf2d0" stroke="#d1b765"/>
    <rect x="400" y="121" width="676" height="62" fill="#f1d0cd" stroke="#ac5a54"/>
    <rect x="400" y="186" width="676" height="62" fill="#f1d0cd" stroke="#ac5a54"/>
  </g>

  <g font-size="33">
    <text x="142" y="94" text-anchor="middle">ob_size = -2</text>
    <text x="142" y="175" text-anchor="middle">ob_digit</text>
  </g>

  <path d="M253 166 H326 V121 H392" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#arrow-int)"/>

  <g font-size="36" text-anchor="middle" letter-spacing="0">
    <text x="732" y="164">0011 1111 1111 1111 1111 1111 1111 1111</text>
    <text x="732" y="229">0000 0000 0000 0000 0000 0000 0000 0100</text>
