<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 444 354" role="img" aria-label="执行栈上压着 range 迭代器与循环变量 0，栈底在下方" font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif" width="444" height="354">
  <defs>
    <marker id="arrow-68bytecode" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- 栈的增长方向 -->
  <path d="M92 240 V 42" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow-68bytecode)"/>
  <text x="89" y="272" font-size="22" text-anchor="middle">栈底</text>

  <!-- 栈：顶部空闲格 + 迭代器 + 循环变量 -->
  <rect x="153" y="43" width="200" height="104" fill="#dbe7fb" stroke="#6c8ebf" stroke-width="1.5"/>
  <rect x="153" y="149" width="200" height="72" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <rect x="153" y="222" width="200" height="70" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>

  <text x="253" y="200" font-size="32" text-anchor="middle">0</text>
  <text x="253" y="273" font-size="32" text-anchor="middle">range 迭代器</text>
</svg>
