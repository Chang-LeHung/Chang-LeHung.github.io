<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 937 390" role="img" aria-label="把中缀表达式 A + B * ( C - D ) - E / F 中已算完的部分与正在计算的括号部分标出，括号部分先算成后缀 CD-，目前得到的后缀表达式是 A + B * CD- - E / F" font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif">
  <!-- 图例 -->
  <rect x="339" y="18" width="34" height="35" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <rect x="339" y="73" width="34" height="35" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <text x="390" y="42" font-size="22" fill="#111">完成计算的部分</text>
  <text x="390" y="97" font-size="22" fill="#111">正在计算的部分</text>

  <!-- 中缀表达式 -->
  <g stroke="#111" stroke-width="1.5" fill="#ffffff">
    <rect x="337" y="140" width="38" height="38"/>
    <rect x="375" y="140" width="37" height="38"/>
    <rect x="412" y="140" width="38" height="38"/>
    <rect x="450" y="140" width="37" height="38"/>
    <rect x="487" y="140" width="38" height="38" fill="#dae8fc"/>
    <rect x="525" y="140" width="37" height="38" fill="#dae8fc"/>
    <rect x="562" y="140" width="37" height="38" fill="#dae8fc"/>
    <rect x="599" y="140" width="38" height="38" fill="#dae8fc"/>
    <rect x="637" y="140" width="37" height="38" fill="#dae8fc"/>
    <rect x="674" y="140" width="38" height="38"/>
    <rect x="712" y="140" width="37" height="38"/>
    <rect x="749" y="140" width="38" height="38"/>
    <rect x="787" y="140" width="38" height="38"/>
  </g>
  <g font-size="21" fill="#111" text-anchor="middle">
    <text x="356" y="166">A</text>
    <text x="393" y="166">+</text>
    <text x="431" y="166">B</text>
    <text x="468" y="166">*</text>
    <text x="506" y="166">(</text>
    <text x="543" y="166">C</text>
    <text x="580" y="166">-</text>
    <text x="618" y="166">D</text>
    <text x="655" y="166">)</text>
    <text x="693" y="166">-</text>
    <text x="730" y="166">E</text>
    <text x="768" y="166">/</text>
    <text x="806" y="166">F</text>
  </g>

  <!-- 向下的虚线箭头 -->
  <path d="M564 192 H594 V246 H609 L579 276 L549 246 H564 Z" fill="#ffffff" stroke="#111" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 目前得到的后缀表达式 -->
  <text x="45" y="320" font-size="24" fill="#111">目前得到的后缀表达式</text>
  <g stroke="#111" stroke-width="1.5">
    <rect x="338" y="292" width="37" height="36" fill="#ffffff"/>
    <rect x="375" y="292" width="38" height="36" fill="#ffffff"/>
    <rect x="413" y="292" width="37" height="36" fill="#f8cecc" stroke="#b85450"/>
    <rect x="450" y="292" width="38" height="36" fill="#f8cecc" stroke="#b85450"/>
    <rect x="534" y="292" width="80" height="36" fill="#f8cecc" stroke="#b85450"/>
    <rect x="675" y="292" width="37" height="36" fill="#ffffff"/>
    <rect x="712" y="292" width="38" height="36" fill="#ffffff"/>
    <rect x="750" y="292" width="37" height="36" fill="#ffffff"/>
    <rect x="787" y="292" width="38" height="36" fill="#ffffff"/>
  </g>
  <g font-size="21" fill="#111" text-anchor="middle">
    <text x="356" y="318">A</text>
    <text x="394" y="318">+</text>
    <text x="431" y="318">B</text>
    <text x="469" y="318">*</text>
    <text x="574" y="318">CD-</text>
    <text x="693" y="318">-</text>
    <text x="731" y="318">E</text>
    <text x="768" y="318">/</text>
    <text x="806" y="318">F</text>
  </g>
</svg>
