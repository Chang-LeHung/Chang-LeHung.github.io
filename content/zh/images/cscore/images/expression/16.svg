<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 722 395" role="img" aria-label="用栈模拟表达式 A + B * ( C - D ) - E / F 的遍历：A 到 D 已经遍历过，刚读到右括号，栈里依次压入了星号和加号" font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif">
  <!-- 栈 -->
  <text x="65" y="44" font-size="22" fill="#000">栈顶</text>
  <rect x="63" y="69" width="47" height="246" fill="#fad7ac" stroke="#d79b00" stroke-width="1.5"/>
  <rect x="68" y="218" width="37" height="38" fill="#fad9d5" stroke="#b85450" stroke-width="1.5"/>
  <rect x="68" y="268" width="37" height="38" fill="#fad9d5" stroke="#b85450" stroke-width="1.5"/>
  <text x="86.5" y="244" font-size="22" text-anchor="middle" fill="#000">*</text>
  <text x="86.5" y="294" font-size="22" text-anchor="middle" fill="#000">+</text>
  <text x="55" y="364" font-size="22" fill="#000">栈底</text>

  <!-- 图例 -->
  <rect x="173" y="69" width="38" height="39" fill="#fad9d5" stroke="#b85450" stroke-width="1.5"/>
  <rect x="173" y="123" width="38" height="38" fill="#b1ddf0" stroke="#10739e" stroke-width="1.5"/>
  <text x="238" y="100" font-size="22" fill="#000">表示正在遍历的位置</text>
  <text x="247" y="149" font-size="22" fill="#000">已经遍历过的位置</text>

  <!-- 已遍历 -->
  <g fill="#b1ddf0" stroke="#10739e" stroke-width="1.2">
    <rect x="173" y="187" width="37.5" height="38"/>
    <rect x="210.5" y="187" width="37.5" height="38"/>
    <rect x="248" y="187" width="37.5" height="38"/>
    <rect x="285.5" y="187" width="37.5" height="38"/>
    <rect x="323" y="187" width="37.5" height="38"/>
    <rect x="360.5" y="187" width="37.5" height="38"/>
    <rect x="398" y="187" width="37.5" height="38"/>
    <rect x="435.5" y="187" width="37.5" height="38"/>
  </g>
  <!-- 正在遍历 -->
  <rect x="473" y="187" width="37.5" height="38" fill="#fad9d5" stroke="#b85450" stroke-width="1.5"/>
  <!-- 未遍历 -->
  <g fill="#fff" stroke="#000" stroke-width="1.2">
    <rect x="510.5" y="187" width="37.5" height="38"/>
    <rect x="548" y="187" width="37.5" height="38"/>
    <rect x="585.5" y="187" width="37.5" height="38"/>
    <rect x="623" y="187" width="37.5" height="38"/>
  </g>

  <g font-size="22" fill="#000" text-anchor="middle">
    <text x="191.7" y="213">A</text>
    <text x="229.2" y="213">+</text>
    <text x="266.7" y="213">B</text>
    <text x="304.2" y="213">*</text>
    <text x="341.7" y="213">(</text>
    <text x="379.2" y="213">C</text>
    <text x="416.7" y="213">-</text>
    <text x="454.2" y="213">D</text>
    <text x="491.7" y="213">)</text>
    <text x="529.2" y="213">-</text>
    <text x="566.7" y="213">E</text>
    <text x="604.2" y="213">/</text>
    <text x="641.7" y="213">F</text>
  </g>
</svg>
