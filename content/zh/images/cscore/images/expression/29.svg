<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 634 374" role="img" aria-label="遍历完整个后缀表达式后栈为空，把表达式 P-N 求得的结果存下来" font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif" width="634" height="374">
  <rect width="634" height="374" fill="#fff"/>

  <!-- 栈（空） -->
  <text x="78" y="37" font-size="21" fill="#111">栈顶</text>
  <rect x="78" y="61" width="47" height="244" fill="#fad7ac" stroke="#d79b00" stroke-width="1"/>
  <text x="78" y="358" font-size="21" fill="#111">栈底</text>

  <!-- 图例 -->
  <rect x="194" y="61" width="37" height="37" fill="#fad9d5" stroke="#b85450" stroke-width="1"/>
  <text x="248" y="87" font-size="21" fill="#111">表示正在遍历的位置</text>
  <rect x="194" y="115" width="37" height="37" fill="#b1ddf0" stroke="#82a5a5" stroke-width="1"/>
  <text x="248" y="141" font-size="21" fill="#111">已经遍历过的位置</text>

  <!-- 字符序列 -->
  <g stroke="#000" stroke-width="1">
    <rect x="189" y="179" width="36" height="38" fill="#b1ddf0"/>
    <rect x="227" y="179" width="36" height="38" fill="#b1ddf0"/>
    <rect x="265" y="179" width="36" height="38" fill="#b1ddf0"/>
    <rect x="303" y="179" width="36" height="38" fill="#b1ddf0"/>
    <rect x="341" y="179" width="35" height="38" fill="#b1ddf0"/>
    <rect x="378" y="179" width="35" height="38" fill="#b1ddf0"/>
    <rect x="415" y="179" width="36" height="38" fill="#b1ddf0"/>
    <rect x="453" y="179" width="36" height="38" fill="#b1ddf0"/>
    <rect x="491" y="179" width="35" height="38" fill="#b1ddf0"/>
    <rect x="528" y="179" width="35" height="38" fill="#b1ddf0"/>
    <rect x="565" y="179" width="35" height="38" fill="#fad9d5"/>
  </g>
  <g font-size="21" fill="#111" text-anchor="middle">
    <text x="207" y="205">A</text>
    <text x="245" y="205">B</text>
    <text x="283" y="205">C</text>
    <text x="321" y="205">D</text>
    <text x="358" y="205">-</text>
    <text x="395" y="205">*</text>
    <text x="433" y="205">+</text>
    <text x="471" y="205">E</text>
    <text x="508" y="205">F</text>
    <text x="545" y="205">/</text>
    <text x="582" y="205">-</text>
  </g>

  <!-- 结果行：P - N = 结果 -->
  <g stroke="#000" stroke-width="1">
    <rect x="227" y="265" width="36" height="38" fill="#b1ddf0"/>
    <rect x="264" y="265" width="37" height="38" fill="#fad9d5"/>
    <rect x="302" y="265" width="36" height="38" fill="#b1ddf0"/>
    <rect x="340" y="265" width="36" height="38" fill="#fff"/>
    <rect x="377" y="265" width="116" height="38" fill="#b1ddf0"/>
  </g>
  <g font-size="21" fill="#111" text-anchor="middle">
    <text x="245" y="291">P</text>
    <text x="282" y="291">-</text>
    <text x="320" y="291">N</text>
    <text x="358" y="291">=</text>
    <text x="435" y="291">结果</text>
  </g>
</svg>
