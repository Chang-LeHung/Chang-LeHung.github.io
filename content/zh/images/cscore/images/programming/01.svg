<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 644 254" role="img" aria-label="IDE 的调用栈面板：标题栏为 CALL STACK 与 Paused on breakpoint，下面四行依次是 init1（exit3.c 第 17 行第 3 列）、__libc_csu_init（第 26 行）、__libc_start_main（第 41 行）和 _start（第 15 行）" font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif">
  <!-- 背景与标题栏 -->
  <rect width="644" height="254" fill="#f2f2f2"/>
  <rect width="644" height="40" fill="#ece8ee"/>
  <path d="M10 11 L20 21 L30 11" fill="none" stroke="#444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="41" y="27" font-size="20" font-weight="bold" fill="#616161">CALL STACK</text>
  <text x="622" y="27" font-size="20" font-weight="bold" fill="#616161" text-anchor="end">Paused on breakpoint</text>

  <!-- 第 1 行：init1 / exit3.c / 17:3 -->
  <rect x="570" y="47" width="57" height="36" rx="18" fill="#bcb3cb"/>
  <text x="598" y="70" font-size="19" fill="#6a6770" text-anchor="middle">17:3</text>
  <text x="61" y="70" font-size="21" fill="#616161" font-family="monospace">init1</text>
  <text x="548" y="70" font-size="21" fill="#616161" text-anchor="end" font-family="monospace">exit3.c</text>

  <!-- 第 2 行：__libc_csu_init -->
  <rect x="584" y="91" width="43" height="36" rx="18" fill="#bcb3cb"/>
  <text x="605" y="114" font-size="19" fill="#6a6770" text-anchor="middle">26</text>
  <text x="60" y="114" font-size="21" fill="#616161" font-family="monospace">__libc_csu_init</text>
  <text x="562" y="114" font-size="21" fill="#616161" text-anchor="end" font-family="monospace">@__libc_csu_init</text>

  <!-- 第 3 行：__libc_start_main -->
  <rect x="584" y="135" width="43" height="36" rx="18" fill="#bcb3cb"/>
  <text x="605" y="158" font-size="19" fill="#6a6770" text-anchor="middle">41</text>
  <text x="60" y="158" font-size="21" fill="#616161" font-family="monospace">__libc_start_main</text>
  <text x="564" y="158" font-size="21" fill="#616161" text-anchor="end" font-family="monospace">@__libc_start_main</text>

  <!-- 第 4 行：_start -->
  <rect x="584" y="179" width="43" height="36" rx="18" fill="#bcb3cb"/>
  <text x="605" y="202" font-size="19" fill="#6a6770" text-anchor="middle">15</text>
  <text x="60" y="202" font-size="21" fill="#616161" font-family="monospace">_start</text>
  <text x="565" y="202" font-size="21" fill="#616161" text-anchor="end" font-family="monospace">@_start</text>
</svg>
