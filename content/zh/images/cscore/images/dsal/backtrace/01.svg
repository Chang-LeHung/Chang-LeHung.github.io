<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1216 579" role="img" aria-label="用回溯法求子集的决策树：框内左侧是已生成的集合，右侧是还能选择的数据，绿色叶子是最终生成的子集" font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif">
  <defs>
    <marker id="arrow-dsalbt01" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111"/>
    </marker>
  </defs>

  <!-- 图例 -->
  <rect x="371" y="35" width="50" height="38" rx="5" fill="#b1ddf0" stroke="#10739e" stroke-width="1.5"/>
  <rect x="627" y="33" width="51" height="39" rx="5" fill="#cdeb8b" stroke="#82b366" stroke-width="1.5"/>
  <text x="440" y="62" font-size="22" fill="#111">中间情况的子集</text>
  <text x="700" y="62" font-size="22" fill="#111">最终生成的子集</text>
  <text x="330" y="130" font-size="22" fill="#111">框内左侧是生成的集合，右侧是当前数组当中还能选择的数据</text>

  <!-- 中间节点 -->
  <g fill="#b1ddf0" stroke="#10739e" stroke-width="1.5">
    <rect x="526" y="153" width="129" height="39" rx="5"/>
    <rect x="254" y="260" width="130" height="38" rx="5"/>
    <rect x="827" y="260" width="129" height="38" rx="5"/>
    <rect x="101" y="368" width="129" height="39" rx="5"/>
    <rect x="379" y="368" width="130" height="39" rx="5"/>
    <rect x="704" y="368" width="130" height="39" rx="5"/>
    <rect x="959" y="368" width="130" height="39" rx="5"/>
  </g>

  <!-- 叶子 -->
  <g fill="#cdeb8b" stroke="#82b366" stroke-width="1.5">
    <rect x="28" y="477" width="130" height="38" rx="5"/>
    <rect x="169" y="477" width="130" height="38" rx="5"/>
    <rect x="311" y="477" width="129" height="38" rx="5"/>
    <rect x="457" y="477" width="129" height="38" rx="5"/>
    <rect x="616" y="477" width="129" height="38" rx="5"/>
    <rect x="756" y="477" width="129" height="38" rx="5"/>
    <rect x="896" y="477" width="129" height="38" rx="5"/>
    <rect x="1042" y="477" width="129" height="38" rx="5"/>
  </g>

  <g font-size="20" fill="#111" text-anchor="middle">
    <text x="590" y="180">[], [1, 2, 3]</text>
    <text x="319" y="286">[1], [2, 3]</text>
    <text x="891" y="286">[], [2, 3]</text>
    <text x="165" y="394">[1, 2], [3]</text>
    <text x="444" y="394">[1], [3]</text>
    <text x="769" y="394">[2], [3]</text>
    <text x="1024" y="394">[], [3]</text>

    <text x="93" y="503">[1, 2, 3], []</text>
    <text x="234" y="503">[1, 2], []</text>
    <text x="375" y="503">[1, 3], []</text>
    <text x="521" y="503">[1], []</text>
    <text x="680" y="503">[2, 3], []</text>
    <text x="820" y="503">[2], []</text>
    <text x="960" y="503">[3], []</text>
    <text x="1106" y="503">[], []</text>
  </g>

  <!-- 连线 -->
  <g fill="none" stroke="#111" stroke-width="1.5">
    <path d="M590 192 V222"/>
    <path d="M319 222 H891"/>
    <path d="M319 222 V260" marker-end="url(#arrow-dsalbt01)"/>
    <path d="M891 222 V260" marker-end="url(#arrow-dsalbt01)"/>

    <path d="M319 298 V332"/>
    <path d="M165 332 H444"/>
    <path d="M165 332 V368" marker-end="url(#arrow-dsalbt01)"/>
    <path d="M444 332 V368" marker-end="url(#arrow-dsalbt01)"/>

    <path d="M891 298 V332"/>
    <path d="M769 332 H1024"/>
    <path d="M769 332 V368" marker-end="url(#arrow-dsalbt01)"/>
    <path d="M1024 332 V368" marker-end="url(#arrow-dsalbt01)"/>

    <path d="M165 407 V440"/>
    <path d="M93 440 H234"/>
    <path d="M93 440 V477" marker-end="url(#arrow-dsalbt01)"/>
    <path d="M234 440 V477" marker-end="url(#arrow-dsalbt01)"/>

    <path d="M444 407 V440"/>
    <path d="M375 440 H521"/>
    <path d="M375 440 V477" marker-end="url(#arrow-dsalbt01)"/>
    <path d="M521 440 V477" marker-end="url(#arrow-dsalbt01)"/>

    <path d="M769 407 V440"/>
    <path d="M680 440 H820"/>
    <path d="M680 440 V477" marker-end="url(#arrow-dsalbt01)"/>
    <path d="M820 440 V477" marker-end="url(#arrow-dsalbt01)"/>

    <path d="M1024 407 V440"/>
    <path d="M960 440 H1106"/>
    <path d="M960 440 V477" marker-end="url(#arrow-dsalbt01)"/>
    <path d="M1106 440 V477" marker-end="url(#arrow-dsalbt01)"/>
  </g>
</svg>
