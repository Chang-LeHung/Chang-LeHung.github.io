<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 923 464" role="img" aria-label="一维 dp 数组滚动更新的示意：上一行的状态覆盖到当前行，遍历方向从前到后，dp[j] 左侧已是第 i 行的状态，dp[j] 自身还是第 i-1 行的状态" font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif">
  <defs>
    <marker id="arrow-dp31" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#36393d"/>
    </marker>
  </defs>

  <!-- 图例 -->
  <rect x="158" y="30" width="62" height="24" fill="#cdeb8b" stroke="#36393d" stroke-width="1.5"/>
  <rect x="158" y="67" width="62" height="24" fill="#cce5ff" stroke="#36393d" stroke-width="1.5"/>
  <g font-size="22" fill="#000">
    <text x="270" y="51">i - 1行的状态</text>
    <text x="268" y="83">i行的状态</text>
  </g>

  <!-- 行标 -->
  <g font-size="22" fill="#000">
    <text x="112" y="139">单行dp数组</text>
    <text x="112" y="199">单行dp数组</text>
  </g>

  <!-- 第 i-1 行：整行都是旧状态 -->
  <g fill="#cdeb8b" stroke="#36393d" stroke-width="1.5">
    <rect x="258" y="117" width="65" height="27"/>
    <rect x="323" y="117" width="65" height="27"/>
    <rect x="388" y="117" width="65" height="27"/>
    <rect x="453" y="117" width="65" height="27"/>
    <rect x="518" y="117" width="65" height="27"/>
    <rect x="583" y="117" width="65" height="27"/>
    <rect x="649" y="117" width="65" height="27"/>
    <rect x="714" y="117" width="65" height="27"/>
  </g>

  <!-- 第 i 行：dp[j] 及其左侧已被覆盖 -->
  <g fill="#cce5ff" stroke="#36393d" stroke-width="1.5">
    <rect x="258" y="177" width="65" height="27"/>
    <rect x="323" y="177" width="65" height="27"/>
    <rect x="388" y="177" width="65" height="27"/>
    <rect x="453" y="177" width="65" height="27"/>
    <rect x="518" y="177" width="65" height="27"/>
  </g>
  <g fill="#cdeb8b" stroke="#36393d" stroke-width="1.5">
    <rect x="583" y="177" width="65" height="27"/>
    <rect x="649" y="177" width="65" height="27"/>
    <rect x="714" y="177" width="65" height="27"/>
  </g>
  <text x="552" y="204" font-size="30" fill="#000" text-anchor="middle">下标=j</text>

  <!-- 遍历方向 -->
  <line x1="287" y1="222" x2="500" y2="222" stroke="#000" stroke-width="7"/>
  <polygon points="498,204 560,222 498,240" fill="#000"/>
  <text x="282" y="270" font-size="22" fill="#000">从前往后进行遍历</text>

  <!-- 指向 dp[j] 的曲线箭头 -->
  <path d="M 416 331 C 416 312 420 300 440 296 C 470 290 520 285 536 268 C 548 254 549 230 550 214"
        fill="none" stroke="#36393d" stroke-width="1.5" marker-end="url(#arrow-dp31)"/>

  <!-- 说明 -->
  <g font-size="22" fill="#000">
    <text x="98" y="367">假如我们正在更新dp[j]，此时dp[j]还是第i-1行的状态而dp[0]到dp[j-1]已经</text>
    <text x="72" y="392">是第i行的状态了，因为我们是&#x4ECE;前到后进行遍历。而要计算dp[j]的第i行状态的</text>
    <text x="73" y="419">结果，那么他需要dp[0]到dp[j-1]的第i行状态的数据，dp[j]的第i-1行状态的数据</text>
  </g>
</svg>
