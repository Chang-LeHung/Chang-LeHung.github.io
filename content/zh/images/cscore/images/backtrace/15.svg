  <!-- 节点文字 -->
  <g font-size="21" fill="#1a1a1a" text-anchor="middle">
    <text x="1090" y="124">[]</text>
    <text x="610" y="270">[1]</text>
    <text x="1570" y="270">[]</text>
    <text x="370" y="428">[1,1]</text>
    <text x="850" y="428">[1]</text>
    <text x="1330" y="428">[1]</text>
    <text x="1810" y="428">[]</text>
    <text x="250" y="593">[1,1,2]</text>
    <text x="490" y="593">[1,1]</text>
    <text x="730" y="593">[1,2]</text>
    <text x="970" y="593">[1]</text>
    <text x="1210" y="593">[1,2]</text>
    <text x="1450" y="593">[1]</text>
    <text x="1690" y="593">[2]</text>
    <text x="1930" y="593">[]</text>
  </g>

  <!-- 分支标注 -->
  <g font-size="20" fill="#333">
    <text x="1078" y="181" text-anchor="end">选择</text>
    <text x="1102" y="181">不选择</text>
    <text x="598" y="333" text-anchor="end">选择</text>
    <text x="622" y="333">不选择</text>
    <text x="1558" y="333" text-anchor="end">选择</text>
    <text x="1582" y="333">不选择</text>
    <text x="358" y="494" text-anchor="end">选择</text>
    <text x="382" y="494">不选择</text>
    <text x="838" y="494" text-anchor="end">选择</text>
    <text x="862" y="494">不选择</text>
    <text x="1318" y="494" text-anchor="end">选择</text>
    <text x="1342" y="494">不选择</text>
    <text x="1798" y="494" text-anchor="end">选择</text>
    <text x="1822" y="494">不选择</text>
  </g>
</svg>
