<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1273 540" role="img" aria-label="每一层选择一个数据的决策树：从 1 开始，对 2 和 3 分别选择或不选，得到八种最终选择结果" font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif">
  <defs>
    <marker id="arrow-backtrace21" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>

  <text x="141" y="71" font-size="23" fill="#111">每一层选择一个数据</text>

  <!-- 节点方框 -->
  <g stroke="#111" stroke-width="1.5" fill="#ffffff">
    <rect x="658" y="42" width="64" height="51"/>
    <rect x="463" y="148" width="63" height="52"/>
    <rect x="859" y="148" width="64" height="52"/>
    <rect x="345" y="269" width="64" height="51"/>
    <rect x="562" y="269" width="64" height="51"/>
    <rect x="756" y="269" width="63" height="51"/>
    <rect x="996" y="269" width="63" height="51"/>
  </g>
  <g font-size="25" fill="#111" text-anchor="middle">
    <text x="690" y="76">1</text>
    <text x="494" y="183">2</text>
    <text x="891" y="183">2</text>
    <text x="377" y="304">3</text>
    <text x="594" y="304">3</text>
    <text x="787" y="304">3</text>
    <text x="1027" y="304">3</text>
  </g>

  <!-- 叶子方块 -->
  <g stroke="#b85450" stroke-width="1.5" fill="#f8cecc">
    <rect x="275" y="377" width="60" height="48"/>
    <rect x="409" y="377" width="60" height="48"/>
    <rect x="509" y="377" width="61" height="48"/>
    <rect x="615" y="377" width="61" height="48"/>
    <rect x="700" y="377" width="63" height="48"/>
    <rect x="825" y="377" width="61" height="48"/>
    <rect x="962" y="377" width="60" height="48"/>
    <rect x="1068" y="377" width="60" height="48"/>
  </g>

  <!-- 连线 -->
  <g fill="none" stroke="#111" stroke-width="1.5">
    <path d="M690 93 V118"/>
    <path d="M494 118 H891"/>
    <path d="M494 118 V148" marker-end="url(#arrow-backtrace21)"/>
    <path d="M891 118 V148" marker-end="url(#arrow-backtrace21)"/>

    <path d="M494 200 V232"/>
    <path d="M376 232 H594"/>
    <path d="M376 232 V269" marker-end="url(#arrow-backtrace21)"/>
    <path d="M594 232 V269" marker-end="url(#arrow-backtrace21)"/>

    <path d="M891 200 V232"/>
    <path d="M787 232 H1027"/>
    <path d="M787 232 V269" marker-end="url(#arrow-backtrace21)"/>
    <path d="M1027 232 V269" marker-end="url(#arrow-backtrace21)"/>

    <path d="M377 320 V345"/>
    <path d="M305 345 H439"/>
    <path d="M305 345 V377" marker-end="url(#arrow-backtrace21)"/>
    <path d="M439 345 V377" marker-end="url(#arrow-backtrace21)"/>

    <path d="M594 320 V345"/>
    <path d="M539 345 H645"/>
    <path d="M539 345 V377" marker-end="url(#arrow-backtrace21)"/>
    <path d="M645 345 V377" marker-end="url(#arrow-backtrace21)"/>

    <path d="M787 320 V345"/>
    <path d="M731 345 H855"/>
    <path d="M731 345 V377" marker-end="url(#arrow-backtrace21)"/>
    <path d="M855 345 V377" marker-end="url(#arrow-backtrace21)"/>

    <path d="M1027 320 V345"/>
    <path d="M992 345 H1098"/>
    <path d="M992 345 V377" marker-end="url(#arrow-backtrace21)"/>
    <path d="M1098 345 V377" marker-end="url(#arrow-backtrace21)"/>
  </g>

  <!-- 分支标注 -->
  <g font-size="22" fill="#111">
    <text x="582" y="110">选</text>
    <text x="752" y="110">不选</text>

    <text x="412" y="228">选</text>
    <text x="522" y="228">不选</text>
    <text x="822" y="228">选</text>
    <text x="932" y="228">不选</text>

    <text x="322" y="338">选</text>
    <text x="415" y="338">不选</text>
    <text x="525" y="338">选</text>
    <text x="642" y="338">不选</text>
    <text x="720" y="338">选</text>
    <text x="786" y="338">不选</text>
    <text x="958" y="338">选</text>
    <text x="1075" y="338">不选</text>
  </g>

  <!-- 结果 -->
  <text x="34" y="460" font-size="23" fill="#111">最终选择结果</text>
  <g font-size="23" fill="#111">
    <text x="261" y="460">[1,2,3]</text>
    <text x="400" y="460">[1,2]</text>
    <text x="505" y="460">[1,3]</text>
    <text x="630" y="460">[1]</text>
    <text x="695" y="460">2,3</text>
    <text x="800" y="460">[2]</text>
    <text x="935" y="460">[3]</text>
    <text x="1025" y="460">[空 一个也没选]</text>
