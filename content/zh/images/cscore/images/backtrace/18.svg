<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1860 1094" role="img"
     aria-label="选择数据的递归树：从[1,1,2]出发逐层挑选，右下两棵绿色的子树是重复计算的部分"
     font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif">
  <defs>
    <marker id="arrow-18" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a2e23"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1860" height="1094" fill="#d9d2d8"/>

  <!-- 图例 -->
  <rect x="76" y="61" width="203" height="93" rx="12" fill="#3c8825" stroke="#235614" stroke-width="2"/>
  <text x="339" y="114" font-size="20" fill="#1d3541">表示重复的子树</text>

  <!-- 节点 -->
  <g stroke="#3f898c" stroke-width="2">
    <rect x="924" y="38" width="377" height="64" rx="10" fill="#f6e6ca"/>
    <rect x="307" y="321" width="377" height="108" rx="10" fill="#f6e6ca"/>
    <rect x="834" y="321" width="377" height="108" rx="10" fill="#f6e6ca"/>
    <rect x="1340" y="321" width="377" height="108" rx="10" fill="#f6e6ca"/>
    <rect x="120" y="682" width="377" height="108" rx="10" fill="#f6e6ca"/>
    <rect x="120" y="930" width="377" height="108" rx="10" fill="#f6e6ca"/>
  </g>
  <g stroke="#235614" stroke-width="2">
    <rect x="525" y="682" width="377" height="108" rx="10" fill="#3c8825"/>
    <rect x="914" y="678" width="377" height="108" rx="10" fill="#3c8825"/>
  </g>

  <g font-size="22" text-anchor="middle" fill="#1d3541">
    <text x="1112" y="83">从[1,1,2]当中选择数据</text>

    <text x="495" y="371">从[1,2]当中选择数据</text>
    <text x="495" y="402">当前选中的数据[1]</text>
    <text x="1022" y="371">从[2]当中选择数据</text>
    <text x="1022" y="402">当前选中的数据[1]</text>
    <text x="1528" y="371">从[]当中选择数据</text>
    <text x="1528" y="402">当前选中的数据[1]</text>

    <text x="308" y="732">从[2]当中选择数据</text>
    <text x="308" y="763">当前选中的数据[1,1]</text>
    <text x="713" y="732">从[]当中选择数据</text>
    <text x="713" y="763">当前选中的数据[1, 2]</text>
    <text x="1102" y="727">从[]当中选择数据</text>
    <text x="1102" y="758">当前选中的数据[1, 2]</text>

    <text x="308" y="980">从[2]当中选择数据</text>
    <text x="308" y="1011">当前选中的数据[1,1,2]</text>
  </g>

  <!-- 箭头 -->
  <g fill="none" stroke="#9a2e23" stroke-width="2" marker-end="url(#arrow-18)">
    <path d="M1112 102 L500 318"/>
    <path d="M1112 102 L1022 318"/>
    <path d="M1112 102 L1528 318"/>
    <path d="M495 429 L312 679"/>
    <path d="M495 429 L709 679"/>
    <path d="M1022 429 L1098 675"/>
    <path d="M308 790 L308 927"/>
  </g>
</svg>
