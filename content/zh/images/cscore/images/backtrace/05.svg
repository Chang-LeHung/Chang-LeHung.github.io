<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2038 752" role="img"
     aria-label="从 1、2、3、4 当中选择两个数的搜索树，四条分支分别得到 1,2 1,3 1,4 2,3 2,4 3,4 六种结果"
     font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif">
  <defs>
    <marker id="arrow-05" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- 图例 -->
  <rect x="63" y="45" width="87" height="69" fill="#f1d0cd" stroke="#ac5a54" stroke-width="1.5"/>
  <text x="202" y="91" font-size="28" fill="#1a1a1a">表示正确的结果</text>

  <!-- 节点 -->
  <g fill="#dfd5e6" stroke="#9174a3" stroke-width="1.5">
    <rect x="764" y="33" width="530" height="93"/>
    <rect x="364" y="295" width="330" height="94"/>
    <rect x="865" y="295" width="330" height="94"/>
    <rect x="1275" y="295" width="331" height="94"/>
    <rect x="1682" y="295" width="330" height="94"/>
  </g>
  <g font-size="29" fill="#1a1a1a">
    <text x="870" y="92">从1,2,3,4当中选择两个数</text>
    <text x="388" y="354">从2,3,4当中选择1个数</text>
    <text x="901" y="354">从3,4当中选择1个数</text>
    <text x="1322" y="354">从4当中选择1个数</text>
    <text x="1733" y="354">没有数可以选择了</text>
  </g>

  <!-- 结果格 -->
  <g fill="#f1d0cd" stroke="#ac5a54" stroke-width="1.5">
    <rect x="322" y="605" width="88" height="70"/>
    <rect x="486" y="605" width="87" height="70"/>
    <rect x="647" y="605" width="87" height="70"/>
    <rect x="846" y="605" width="87" height="70"/>
    <rect x="1007" y="605" width="87" height="70"/>
    <rect x="1398" y="605" width="87" height="70"/>
  </g>
  <g font-size="26" text-anchor="middle" fill="#1a1a1a">
    <text x="366" y="653">1, 2</text>
    <text x="529" y="653">1, 3</text>
    <text x="690" y="653">1, 4</text>
    <text x="889" y="653">2, 3</text>
    <text x="1050" y="653">2, 4</text>
    <text x="1441" y="653">3, 4</text>
  </g>
  <text x="62" y="660" font-size="28" fill="#1a1a1a">结果</text>

  <!-- 第一层分支 -->
  <path d="M1029 126 V210" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M528 210 H1847" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <g fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow-05)">
    <path d="M528 210 V292"/>
    <path d="M1030 210 V292"/>
    <path d="M1440 210 V292"/>
    <path d="M1847 210 V292"/>
  </g>
  <g font-size="26" fill="#1a1a1a">
    <text x="433" y="291">选择1</text>
    <text x="940" y="291">选择2</text>
    <text x="1440" y="291">选择3</text>
    <text x="1900" y="291">选择4</text>
  </g>

  <!-- 第二层分支 -->
  <g fill="none" stroke="#1a1a1a" stroke-width="1.5">
    <path d="M445 389 V496 H366"/>
    <path d="M611 389 V496 H690"/>
    <path d="M946 389 V496 H889"/>
    <path d="M1112 389 V496 H1050"/>
  </g>
  <g fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow-05)">
    <path d="M366 496 V602"/>
    <path d="M529 389 V602"/>
    <path d="M690 496 V602"/>
    <path d="M889 496 V602"/>
    <path d="M1050 496 V602"/>
    <path d="M1440 389 V602"/>
  </g>
</svg>
