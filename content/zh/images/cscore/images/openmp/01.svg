<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 948 296" role="img"
     aria-label="OpenMP 的 fork-join 执行模型：master thread 依次进入三个并行区域，每个区域内分出若干线程，区域结束时在同步点汇合"
     font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif">
  <defs>
    <marker id="arrow-o01" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>

  <!-- 并行区域的分叉带状回路 -->
  <g fill="none" stroke="#dcdcf0" stroke-width="9" stroke-linejoin="round">
    <path d="M150 88 L162 26 H236 L240 88"/>
    <path d="M370 88 L380 16 H456 L465 88"/>
    <path d="M610 88 L620 26 H700 L705 88"/>
  </g>
  <g fill="none" stroke="#b9b9c9" stroke-width="1" stroke-dasharray="3 3">
    <rect x="156" y="22" width="84" height="144"/>
    <rect x="374" y="12" width="88" height="128"/>
    <rect x="614" y="22" width="88" height="120"/>
  </g>

  <!-- master thread 主干 -->
  <g fill="#dcdcf0" stroke="#b6b6d8" stroke-width="1.2">
    <rect x="40" y="81" width="110" height="15" rx="7"/>
    <rect x="240" y="81" width="130" height="15" rx="7"/>
    <rect x="465" y="81" width="145" height="15" rx="7"/>
    <rect x="705" y="81" width="200" height="15" rx="7"/>
  </g>
  <g fill="#333">
    <circle cx="150" cy="88" r="5"/>
    <circle cx="240" cy="88" r="5"/>
    <circle cx="370" cy="88" r="5"/>
    <circle cx="465" cy="88" r="5"/>
    <circle cx="610" cy="88" r="5"/>
    <circle cx="705" cy="88" r="5"/>
  </g>

  <!-- 区域 1：三个线程 -->
  <g stroke-width="1.5" font-size="18" text-anchor="middle">
    <rect x="168" y="34" width="64" height="22" fill="#22a03a" stroke="#1a7a2c"/>
    <rect x="168" y="70" width="64" height="22" fill="#1e3fa8" stroke="#16307d"/>
    <rect x="168" y="118" width="64" height="22" fill="#a01b1b" stroke="#7d1414"/>
    <g fill="#fff" font-weight="bold">
      <text x="200" y="51">1</text>
      <text x="200" y="87">2</text>
      <text x="200" y="135">3</text>
    </g>
    <text x="200" y="112" font-size="18" font-style="italic" fill="#222">threads</text>
  </g>

  <!-- 区域 2：四个线程 -->
  <g stroke-width="1.5" font-size="18" text-anchor="middle">
    <rect x="382" y="20" width="70" height="19" fill="#22a03a" stroke="#1a7a2c"/>
    <rect x="382" y="44" width="70" height="19" fill="#d9c22b" stroke="#a8931c"/>
    <rect x="382" y="84" width="70" height="19" fill="#1e3fa8" stroke="#16307d"/>
    <rect x="382" y="112" width="70" height="19" fill="#a01b1b" stroke="#7d1414"/>
    <g fill="#fff" font-weight="bold">
      <text x="417" y="35">1</text>
      <text x="417" y="59">2</text>
      <text x="417" y="99">3</text>
      <text x="417" y="127">4</text>
    </g>
    <text x="417" y="79" font-size="17" font-style="italic" fill="#222">threads</text>
  </g>

  <!-- 区域 3：两个线程 -->
  <g stroke-width="1.5" font-size="18" text-anchor="middle">
    <rect x="622" y="34" width="70" height="22" fill="#22a03a" stroke="#1a7a2c"/>
    <rect x="622" y="82" width="70" height="22" fill="#d9c22b" stroke="#a8931c"/>
    <g fill="#fff" font-weight="bold">
      <text x="657" y="51">1</text>
      <text x="657" y="99">2</text>
    </g>
    <text x="657" y="74" font-size="18" font-style="italic" fill="#222">threads</text>
  </g>

  <!-- 标注 -->
  <text x="34" y="46" font-size="20" fill="#c0392b">master thread</text>
  <path d="M86 56 L64 76" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow-o01)"/>

  <text x="152" y="212" font-size="19" fill="#3b3bd6">parallel region</text>
  <text x="372" y="212" font-size="19" fill="#3b3bd6">parallel region</text>
  <text x="612" y="212" font-size="19" fill="#3b3bd6">parallel region</text>

  <text x="22" y="272" font-size="22" font-style="italic">Fork threads</text>
  <path d="M118 256 L147 104" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow-o01)"/>

  <text x="330" y="278" font-size="22">Team of threads</text>
  <g fill="none" stroke="#222" stroke-width="1.5">
    <path d="M470 262 L466 104" marker-end="url(#arrow-o01)"/>
    <path d="M470 262 L607 104" marker-end="url(#arrow-o01)"/>
  </g>

  <text x="596" y="272" font-size="21" font-style="italic">Join threads: Synchronization point</text>
  <path d="M688 256 L703 104" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow-o01)"/>
</svg>
