<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 948 296" role="img"
     aria-label="OpenMP 的 fork-join 执行模型：master thread 依次进入三个并行区域，每个区域内分出若干线程，区域结束时在同步点汇合"
     font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif">
  <defs>
    <marker id="arrow-o01" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>

  <!-- 三个并行区域的带状轮廓 -->
  <g fill="#e8e8f6" stroke="#b6b6d8" stroke-width="1.2">
    <path d="M150 88 L170 34 H230 L240 88 Z"/>
    <path d="M370 88 L388 26 H450 L465 88 Z"/>
    <path d="M610 88 L628 34 H688 L705 88 Z"/>
  </g>

  <!-- master thread 主干 -->
  <g fill="#dcdcf0" stroke="#b6b6d8" stroke-width="1.2">
    <rect x="40" y="81" width="110" height="15" rx="7"/>
    <rect x="240" y="81" width="130" height="15" rx="7"/>
    <rect x="465" y="81" width="145" height="15" rx="7"/>
    <rect x="705" y="81" width="200" height="15" rx="7"/>
  </g>
  <g fill="#333">
    <circle cx="150" cy="88" r="5"/>
    <circle cx="240" cy="88" r="5"/>
    <circle cx="370" cy="88" r="5"/>
    <circle cx="465" cy="88" r="5"/>
    <circle cx="610" cy="88" r="5"/>
    <circle cx="705" cy="88" r="5"/>
  </g>

  <!-- 区域 1：三个线程 -->
  <g stroke-width="1.5" font-size="18" text-anchor="middle">
    <rect x="168" y="38" width="64" height="22" fill="#22a03a" stroke="#1a7a2c"/>
    <rect x="168" y="76" width="64" height="22" fill="#1e3fa8" stroke="#16307d"/>
    <rect x="168" y="128" width="64" height="22" fill="#a01b1b" stroke="#7d1414"/>
    <g fill="#fff" font-weight="bold">
      <text x="200" y="55">1</text>
      <text x="200" y="93">2</text>
      <text x="200" y="145">3</text>
    </g>
    <text x="200" y="120" font-size="18" font-style="italic" fill="#222">threads</text>
  </g>

  <!-- 区域 2：四个线程 -->
  <g stroke-width="1.5" font-size="18" text-anchor="middle">
    <rect x="386" y="26" width="66" height="20" fill="#22a03a" stroke="#1a7a2c"/>
    <rect x="386" y="52" width="66" height="20" fill="#d9c22b" stroke="#a8931c"/>
    <rect x="386" y="88" width="66" height="20" fill="#1e3fa8" stroke="#16307d"/>
    <rect x="386" y="126" width="66" height="20" fill="#a01b1b" stroke="#7d1414"/>
    <g fill="#fff" font-weight="bold">
      <text x="419" y="42">1</text>
      <text x="419" y="68">2</text>
      <text x="419" y="104">3</text>
      <text x="419" y="141">4</text>
    </g>
    <text x="419" y="82" font-size="17" font-style="italic" fill="#222">threads</text>
  </g>

  <!-- 区域 3：两个线程 -->
  <g stroke-width="1.5" font-size="18" text-anchor="middle">
    <rect x="628" y="38" width="66" height="22" fill="#22a03a" stroke="#1a7a2c"/>
    <rect x="628" y="82" width="66" height="22" fill="#d9c22b" stroke="#a8931c"/>
    <g fill="#fff" font-weight="bold">
      <text x="661" y="55">1</text>
      <text x="661" y="99">2</text>
    </g>
    <text x="661" y="126" font-size="18" font-style="italic" fill="#222">threads</text>
  </g>

  <!-- 标注 -->
  <text x="34" y="46" font-size="20" fill="#c0392b">master thread</text>
  <path d="M86 56 L64 76" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow-o01)"/>

  <text x="152" y="212" font-size="19" fill="#3b3bd6">parallel region</text>
  <text x="372" y="212" font-size="19" fill="#3b3bd6">parallel region</text>
  <text x="612" y="212" font-size="19" fill="#3b3bd6">parallel region</text>

  <text x="22" y="272" font-size="22" font-style="italic">Fork threads</text>
  <path d="M118 256 L147 104" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow-o01)"/>

  <text x="330" y="278" font-size="22">Team of threads</text>
  <g fill="none" stroke="#222" stroke-width="1.5">
    <path d="M470 262 L466 104" marker-end="url(#arrow-o01)"/>
    <path d="M470 262 L607 104" marker-end="url(#arrow-o01)"/>
  </g>

  <text x="600" y="272" font-size="22" font-style="italic">Join threads: Synchronization point</text>
  <path d="M690 256 L703 104" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow-o01)"/>
</svg>
