<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1744 1000" role="img" aria-label="两个 CPU 同时把主内存里的 data = 1 读进各自的寄存器再各自加一，由于交错执行，最终主内存里的 data 只变成 2" font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif">
  <defs>
    <marker id="arrow-openmp07" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d87d2e"/>
    </marker>
  </defs>

  <!-- 主内存 -->
  <rect x="416" y="44" width="766" height="358" rx="46" fill="none" stroke="#5a3fbd" stroke-width="2.5"/>
  <text x="593" y="158" font-size="42" fill="#982c4d">Main memory : RAM</text>
  <rect x="592" y="237" width="385" height="118" rx="26" fill="none" stroke="#5a3fbd" stroke-width="2.5"/>
  <text x="700" y="303" font-size="40" fill="#5a3fbd">data = 1</text>

  <!-- 两条交错线 -->
  <g stroke="#d87d2e" stroke-width="4" stroke-linecap="round">
    <path d="M655 345 L905 412"/>
    <path d="M640 408 L900 350"/>
  </g>

  <!-- data++ 标注 -->
  <text x="509" y="462" font-size="34" fill="#28785a">data++</text>
  <text x="914" y="455" font-size="34" fill="#28785a">data++</text>

  <!-- 指向 CPU 的箭头 -->
  <g stroke="#d87d2e" stroke-width="4" fill="none">
    <path d="M560 472 L410 548" marker-end="url(#arrow-openmp07)"/>
    <path d="M1085 478 L1230 548" marker-end="url(#arrow-openmp07)"/>
  </g>

  <!-- CPU -->
  <g fill="none" stroke="#111" stroke-width="3">
    <path d="M355 563 L461 641 L355 719 L249 641 Z"/>
    <path d="M1223 549 L1329 639 L1223 729 L1117 639 Z"/>
  </g>
  <text x="355" y="652" font-size="34" fill="#111" text-anchor="middle">CPU0</text>
  <text x="1223" y="650" font-size="34" fill="#111" text-anchor="middle">CPU1</text>

  <!-- CPU0 的执行序列 -->
  <g font-size="30" fill="#b02020">
    <text x="54" y="838">1&gt; load data  : cpu0 data = 1</text>
    <text x="54" y="888">3&gt; data++      : cpu0 data = 2</text>
    <text x="54" y="938">4&gt; store data : main memory data = 2</text>
  </g>

  <!-- CPU1 的执行序列 -->
  <g font-size="30" fill="#1a7a4a">
    <text x="924" y="830">2&gt; load data  : cpu1 data = 1</text>
    <text x="924" y="880">5&gt; data++      : cpu1 data = 2</text>
    <text x="924" y="930">6&gt; store data : main memory data = 2</text>
  </g>
</svg>
