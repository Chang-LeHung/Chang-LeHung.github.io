<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1906 734" role="img"
     aria-label="OpenMP 并行域示意图：主线程先把初值写入，多个线程各自计算 x_square_partial_integral，在路障处汇总求和后再继续"
     font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif">
  <defs>
    <marker id="arrow-openmp04" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- 并行域 -->
  <rect x="353" y="40" width="863" height="658" fill="#f7cea0" stroke="#d79b00" stroke-width="1.5"/>
  <text x="1050" y="105" font-size="26" fill="#e01b1b">并行域</text>

  <!-- 四个线程的计算 -->
  <g stroke-width="1.5">
    <rect x="431" y="151" width="449" height="68" fill="#dde8fa" stroke="#6c8ebf"/>
    <rect x="431" y="290" width="449" height="68" fill="#dfd5e6" stroke="#9673a6"/>
    <rect x="431" y="403" width="449" height="68" fill="#f1d0cd" stroke="#b85450"/>
    <rect x="431" y="583" width="449" height="68" fill="#fbe7cf" stroke="#d79b00"/>
  </g>
  <g font-size="22" text-anchor="middle" fill="#1a1a1a">
    <text x="655" y="192">x_square_partial_integral</text>
    <text x="655" y="331">x_square_partial_integral</text>
    <text x="655" y="444">x_square_partial_integral</text>
    <text x="655" y="624">x_square_partial_integral</text>
  </g>
  <!-- 省略号：省略中间的线程 -->
  <g fill="#1a1a1a">
    <circle cx="655" cy="512" r="3"/>
    <circle cx="655" cy="526" r="3"/>
    <circle cx="655" cy="540" r="3"/>
    <circle cx="655" cy="554" r="3"/>
  </g>

  <!-- 路障 -->
  <rect x="1007" y="344" width="200" height="126" fill="#fdf5d7" stroke="#d6b656" stroke-width="1.5"/>
  <text x="1017" y="382" font-size="18" fill="#e01b1b">路障</text>
  <text x="1056" y="382" font-size="18">等待所有线</text>
  <text x="1017" y="408" font-size="18">程执行完成 并且</text>
  <text x="1017" y="434" font-size="18">完成求和操作</text>

  <!-- 箭头 -->
  <g fill="none" stroke="#1a1a1a" stroke-width="1.5">
    <path d="M332 350 L424 187" marker-end="url(#arrow-openmp04)"/>
    <path d="M332 350 L424 326" marker-end="url(#arrow-openmp04)"/>
    <path d="M332 350 L424 439" marker-end="url(#arrow-openmp04)"/>
    <path d="M332 350 L424 619" marker-end="url(#arrow-openmp04)"/>

    <path d="M882 187 L1002 400" marker-end="url(#arrow-openmp04)"/>
    <path d="M882 326 L1002 400" marker-end="url(#arrow-openmp04)"/>
    <path d="M882 439 L1002 400" marker-end="url(#arrow-openmp04)"/>
    <path d="M882 619 L1002 400" marker-end="url(#arrow-openmp04)"/>

    <path d="M1209 407 H1245" marker-end="url(#arrow-openmp04)"/>
  </g>

  <!-- 左侧：主线程准备数据 -->
  <text x="40" y="245" font-size="22" fill="#e01b1b">主线程执行这部分</text>
  <rect x="30" y="272" width="300" height="158" fill="#f5f5f5"/>
  <g font-size="24" font-family="monospace" fill="#1a1a1a">
    <text x="45" y="310">int s = 0;</text>
    <text x="45" y="352">int e = 10;</text>
    <text x="45" y="394">double sum = 0;</text>
  </g>

  <!-- 右侧：主线程输出结果 -->
  <text x="1440" y="285" font-size="22" fill="#e01b1b">主线程执行这部分</text>
  <rect x="1250" y="300" width="620" height="120" fill="#f5f5f5"/>
  <g font-size="24" font-family="monospace" fill="#1a1a1a">
    <text x="1265" y="348">printf("sum = %lf\n", sum);</text>
    <text x="1265" y="398">return 0;</text>
  </g>
</svg>
