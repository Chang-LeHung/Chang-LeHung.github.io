<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 836" role="img" aria-label="指令执行顺序上普通读、普通写与 volatile 写的排列，以及 StoreStore 屏障和 StoreLoad 屏障禁止的重排序" font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif" width="1120" height="836">
  <defs>
    <marker id="arrow-concurrency26" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>

  <rect width="1120" height="836" fill="#fff"/>

  <!-- 执行顺序箭头 -->
  <path d="M281 50 V775" fill="none" stroke="#111" stroke-width="4" marker-end="url(#arrow-concurrency26)"/>
  <text x="25" y="320" font-size="30" fill="#111">指令执行的顺序</text>

  <!-- 五个方块 -->
  <rect x="416" y="32" width="242" height="121" fill="#d9e7d6" stroke="#8cb26e" stroke-width="2"/>
  <text x="537" y="103" font-size="34" fill="#111" text-anchor="middle">普通读</text>

  <rect x="416" y="186" width="242" height="121" fill="#d9e7d6" stroke="#8cb26e" stroke-width="2"/>
  <text x="537" y="257" font-size="34" fill="#111" text-anchor="middle">普通写</text>

  <rect x="416" y="341" width="242" height="115" rx="14" fill="#fdf2d0" stroke="#d1b765" stroke-width="2"/>
  <text x="537" y="410" font-size="34" fill="#111" text-anchor="middle">StoreStore屏障</text>

  <rect x="416" y="492" width="242" height="114" fill="#f1d0cd" stroke="#b85548" stroke-width="2"/>
  <text x="537" y="561" font-size="34" fill="#111" text-anchor="middle">Volatile写</text>

  <rect x="416" y="643" width="242" height="114" rx="14" fill="#fdf2d0" stroke="#d1b765" stroke-width="2"/>
  <text x="537" y="712" font-size="34" fill="#111" text-anchor="middle">StoreLoad屏障</text>

  <!-- 右侧说明 -->
  <g font-size="30" fill="#111">
    <text x="690" y="392">禁止上面所有的普通写和</text>
    <text x="712" y="428">下面的voaltile写重排序</text>
    <text x="673" y="680">禁止下面所有的volatile写和</text>
    <text x="700" y="716">上面的volatile读写重排序</text>
  </g>
</svg>
