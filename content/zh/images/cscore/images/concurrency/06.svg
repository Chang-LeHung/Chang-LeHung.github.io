<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 583" role="img" aria-label="函数 y 等于 x 平方的曲线，0 到 10 之间用一列竖线表示积分求和" font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif" width="848" height="583">
  <!-- 绘图区 -->
  <rect x="77" y="49" width="696" height="452" fill="#eaeaf2"/>

  <!-- 曲线下方的面积 -->
  <path d="M108 500 L123.8 499.7 L139.6 498.9 L155.3 497.6 L171.1 495.7 L186.9 493.3 L202.7 490.3 L218.5 486.9 L234.2 482.8 L250 478.3 L265.8 473.2 L281.6 467.5 L297.4 461.4 L313.1 454.7 L328.9 447.4 L344.7 439.7 L360.5 431.3 L376.3 422.5 L392 413.1 L407.8 403.2 L423.6 392.7 L439.4 381.7 L455.2 370.2 L470.9 358.1 L486.7 345.5 L502.5 332.4 L518.3 318.7 L534.1 304.5 L549.8 289.7 L565.6 274.4 L581.4 258.6 L597.2 242.3 L613 225.4 L628.7 207.9 L634 202 L634 500 Z"
        fill="#e6e6e6"/>

  <!-- 一列竖直细线 -->
  <path d="M106.7 500 V500.0 M119.9 500 V499.8 M133.1 500 V499.3 M146.3 500 V498.4 M159.5 500 V497.1 M172.7 500 V495.5 M185.9 500 V493.5 M199.1 500 V491.1 M212.3 500 V488.3 M225.5 500 V485.1 M238.7 500 V481.6 M251.9 500 V477.7 M265.1 500 V473.4 M278.3 500 V468.8 M291.5 500 V463.7 M304.7 500 V458.3 M317.9 500 V452.5 M331.1 500 V446.4 M344.3 500 V439.9 M357.5 500 V433.0 M370.7 500 V425.7 M383.9 500 V418.0 M397.1 500 V410.0 M410.3 500 V401.6 M423.5 500 V392.8 M436.7 500 V383.6 M449.9 500 V374.1 M463.1 500 V364.2 M476.3 500 V353.9 M489.5 500 V343.2 M502.7 500 V332.2 M515.9 500 V320.8 M529.1 500 V309.0 M542.3 500 V296.8 M555.5 500 V284.3 M568.7 500 V271.4 M581.9 500 V258.1 M595.1 500 V244.4 M608.3 500 V230.4 M621.5 500 V216.0"
        fill="none" stroke="#4c72b0" stroke-width="2.5"/>

  <!-- x=0 与 x=10 两条竖线 -->
  <path d="M108 49 V500" stroke="#ffffff" stroke-width="2" fill="none"/>
  <path d="M635.5 49 V500" stroke="#9a9a9a" stroke-width="1.5" fill="none"/>

  <!-- y = x^2 曲线 -->
  <path d="M108 500 L123.8 499.7 L139.6 498.9 L155.3 497.6 L171.1 495.7 L186.9 493.3 L202.7 490.3 L218.5 486.9 L234.2 482.8 L250 478.3 L265.8 473.2 L281.6 467.5 L297.4 461.4 L313.1 454.7 L328.9 447.4 L344.7 439.7 L360.5 431.3 L376.3 422.5 L392 413.1 L407.8 403.2 L423.6 392.7 L439.4 381.7 L455.2 370.2 L470.9 358.1 L486.7 345.5 L502.5 332.4 L518.3 318.7 L534.1 304.5 L549.8 289.7 L565.6 274.4 L581.4 258.6 L597.2 242.3 L613 225.4 L628.7 207.9 L644.5 190 L660.3 171.5 L676.1 152.4 L691.9 132.8 L707.6 112.7 L723.4 92.1 L739.2 70.9"
        fill="none" stroke="#c44e52" stroke-width="3"/>

  <!-- 坐标标签 -->
  <g fill="#262626">
    <text x="34" y="41" font-size="24" font-style="italic">y</text>
    <text x="768" y="540" font-size="22" font-style="italic" text-anchor="middle">x</text>
    <text x="108" y="530" font-size="21" text-anchor="middle">0</text>
    <text x="635" y="528" font-size="21" text-anchor="middle">10</text>
  </g>

  <!-- y = x^2 -->
  <g fill="#262626">
    <text x="587" y="142" font-size="26" font-style="italic">y</text>
    <text x="605" y="142" font-size="26">=</text>
    <text x="629" y="142" font-size="26" font-style="italic">x</text>
    <text x="645" y="123" font-size="17" font-style="italic">2</text>
  </g>
</svg>
