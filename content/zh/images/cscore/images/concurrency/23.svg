<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1452 988" role="img" aria-label="JMM 中线程、工作内存与主内存的关系：线程Reader 和线程Updater 各自把变量 flag 的副本放在本地内存，线程本地内存与主内存之间的交互由 JMM 控制" font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif">
  <defs>
    <marker id="arrow-concurrency23" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <!-- 主内存 -->
  <rect x="180" y="722" width="998" height="234" rx="30" fill="#f1d0cd" stroke="#ac5a54" stroke-width="1.5"/>
  <text x="682" y="852" font-size="29" text-anchor="middle" fill="#000">主内存</text>
  <ellipse cx="458" cy="839" rx="107" ry="70" fill="#dfd5e6" stroke="#69656d" stroke-width="1.5"/>
  <text x="458" y="856" font-size="29" text-anchor="middle" fill="#000">变量flag</text>

  <!-- 线程本地内存和主内存的交互由 JMM 控制 -->
  <rect x="18" y="549" width="1408" height="110" fill="#d9e7d6" stroke="#8cb26e" stroke-width="1.5"/>
  <text x="385" y="617" font-size="33" fill="#000">线程本地内存和主内存的交互由JMM控制</text>

  <!-- 两个线程 -->
  <rect x="202" y="20" width="217" height="108" fill="#fbe7cf" stroke="#ce9d35" stroke-width="1.5"/>
  <rect x="906" y="16" width="216" height="108" fill="#fbe7cf" stroke="#ce9d35" stroke-width="1.5"/>
  <text x="310" y="87" font-size="33" text-anchor="middle" fill="#000">线程Reader</text>
  <text x="1013" y="88" font-size="33" text-anchor="middle" fill="#000">线程Updater</text>

  <rect x="204" y="236" width="216" height="218" fill="#dde8fa" stroke="#738cbb" stroke-width="1.5"/>
  <rect x="906" y="236" width="216" height="218" fill="#dde8fa" stroke="#738cbb" stroke-width="1.5"/>
  <ellipse cx="312" cy="337" rx="106" ry="70" fill="#dfd5e6" stroke="#69656d" stroke-width="1.5"/>
  <ellipse cx="1014" cy="337" rx="106" ry="70" fill="#dfd5e6" stroke="#69656d" stroke-width="1.5"/>
  <text x="311" y="354" font-size="30" text-anchor="middle" fill="#000">变量flag副本</text>
  <text x="1013" y="354" font-size="30" text-anchor="middle" fill="#000">变量flag副本</text>

  <text x="340" y="222" font-size="30" fill="#000">本地内存（工作内存）</text>
  <text x="1042" y="219" font-size="30" fill="#000">本地内存（工作内存）</text>

  <!-- 双向箭头与曲线 -->
  <g fill="none" stroke="#000" stroke-width="1.5"
     marker-start="url(#arrow-concurrency23)" marker-end="url(#arrow-concurrency23)">
    <path d="M 310 128 V 232"/>
    <path d="M 1012 124 V 232"/>
    <path d="M 311 463 C 312 530 325 565 352 583 C 395 610 424 630 428 670 L 429 700"/>
    <path d="M 1013 463 C 1012 520 1004 555 985 580 C 960 605 935 620 930 660 L 928 700"/>
  </g>
</svg>
