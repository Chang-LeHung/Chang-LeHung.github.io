<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 737 286" role="img" aria-label="主内存 data = 1 与两个线程工作内存中的 data 之间双向读写的示意图" font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif" width="737" height="286">
  <defs>
    <marker id="arrow-concurrency18" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>

  <rect width="737" height="286" fill="#fff"/>

  <!-- 双向箭头 -->
  <g fill="none" stroke="#111" stroke-width="1.6">
    <path d="M365 95 L128 180" marker-start="url(#arrow-concurrency18)" marker-end="url(#arrow-concurrency18)"/>
    <path d="M365 95 L600 180" marker-start="url(#arrow-concurrency18)" marker-end="url(#arrow-concurrency18)"/>
  </g>

  <!-- 主内存 -->
  <rect x="225" y="26" width="280" height="66" rx="8" fill="#fad9d5" stroke="#b85548" stroke-width="2"/>
  <text x="365" y="68" font-size="26" fill="#111" text-anchor="middle">主内存 data = 1</text>

  <!-- 两个线程工作内存 -->
  <rect x="15" y="182" width="234" height="51" rx="6" fill="#d0cee2" stroke="#56517e" stroke-width="2"/>
  <text x="132" y="216" font-size="22" fill="#111" text-anchor="middle">线程工作内存 data = 1</text>

  <rect x="487" y="182" width="234" height="51" rx="6" fill="#d0cee2" stroke="#56517e" stroke-width="2"/>
  <text x="604" y="216" font-size="22" fill="#111" text-anchor="middle">线程工作内存 data = 1</text>
</svg>
