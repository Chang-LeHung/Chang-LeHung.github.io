<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1004 353" role="img"
     aria-label="线程创建过程中用户态与内核态的往返：用户态把请求交给内核态，内核态创建线程并执行函数后返回用户态，两次跨越都要上下文切换"
     font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif">
  <defs>
    <marker id="arrow-59" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <rect x="314" y="31" width="119" height="59" fill="#d5e5fa" stroke="#6284b4" stroke-width="1.5"/>
  <rect x="314" y="246" width="119" height="59" fill="#f4c9c6" stroke="#aa4f48" stroke-width="1.5"/>
  <rect x="692" y="246" width="119" height="59" fill="#f4c9c6" stroke="#aa4f48" stroke-width="1.5"/>
  <g font-size="18" text-anchor="middle" fill="#1a1a1a">
    <text x="373" y="68">用户态</text>
    <text x="373" y="283">内核态1</text>
    <text x="751" y="283">内核态</text>
  </g>

  <!-- 内核态1 -> 内核态 -->
  <path d="M433 275 H689" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow-59)"/>
  <text x="453" y="250" font-size="18" fill="#1a1a1a">创建线程并且执行函数func</text>

  <!-- 用户态 -> 内核态1 -->
  <path d="M344 91 C280 140 250 240 306 276" fill="none" stroke="#444" stroke-width="1.5"
        marker-end="url(#arrow-59)"/>
  <text x="290" y="153" font-size="20" fill="#f63f30">用户态到内核态</text>
  <text x="274" y="179" font-size="20" fill="#f63f30">需要一个上下文切换</text>

  <!-- 内核态 -> 用户态 -->
  <path d="M751 245 C790 200 620 80 438 60" fill="none" stroke="#444" stroke-width="1.5"
        marker-end="url(#arrow-59)"/>
  <text x="650" y="90" font-size="20" fill="#1a1a1a">线程创建完成</text>
  <text x="762" y="149" font-size="20" fill="#f63f30">内核态到用户态</text>
  <text x="742" y="171" font-size="20" fill="#f63f30">需要一个上下文切换</text>

  <!-- 左侧需求说明 -->
  <text x="27" y="153" font-size="20" fill="#1a1a1a">我要创建线程，而且让这个</text>
  <text x="65" y="182" font-size="20" fill="#1a1a1a">线程执行函数func</text>
</svg>
