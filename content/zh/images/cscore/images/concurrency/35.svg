<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 1022" role="img"
     aria-label="CPU 缓存层级：两个核心各有自己的指令与数据一级缓存，共用一个二级缓存，再往下是三级 cache 和内存 RAM"
     font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif">
  <defs>
    <marker id="arrow-35" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37393d"/>
    </marker>
  </defs>

  <rect x="80" y="39" width="1066" height="764" fill="#f9f7ee" stroke="#37393d" stroke-width="2"/>
  <text x="624" y="101" text-anchor="middle" font-size="32">CPU</text>

  <!-- 两个核心 -->
  <g stroke-width="1.5">
    <rect x="254" y="93" width="200" height="78" fill="#f1d0cd" stroke="#b85450"/>
    <rect x="802" y="93" width="200" height="78" fill="#f1d0cd" stroke="#b85450"/>
  </g>
  <g font-size="28" text-anchor="middle" fill="#1a1a1a">
    <text x="354" y="140">CPU- Core0</text>
    <text x="902" y="140">CPU- Core1</text>
  </g>

  <!-- 一级缓存：每个核心一对 -->
  <g stroke-width="1.5">
    <rect x="120" y="271" width="180" height="92" fill="#badcee" stroke="#6c8ebf"/>
    <rect x="392" y="271" width="180" height="92" fill="#dde8fa" stroke="#6c8ebf"/>
    <rect x="668" y="271" width="180" height="92" fill="#badcee" stroke="#6c8ebf"/>
    <rect x="940" y="271" width="180" height="92" fill="#dde8fa" stroke="#6c8ebf"/>
  </g>
  <g font-size="28" text-anchor="middle" fill="#1a1a1a">
    <text x="210" y="309">一级指令</text>
    <text x="210" y="349">Cache</text>
    <text x="482" y="309">一级数据</text>
    <text x="482" y="349">Cache</text>
    <text x="758" y="309">一级指令</text>
    <text x="758" y="349">Cache</text>
    <text x="1030" y="309">一级数据</text>
    <text x="1030" y="349">Cache</text>
  </g>

  <!-- 二级缓存 -->
  <g stroke-width="1.5">
    <rect x="229" y="457" width="237" height="102" fill="#d0cee0" stroke="#55517b"/>
    <rect x="777" y="457" width="237" height="102" fill="#d0cee0" stroke="#55517b"/>
  </g>
  <g font-size="28" text-anchor="middle" fill="#1a1a1a">
    <text x="347" y="519">二级Cache</text>
    <text x="895" y="519">二级Cache</text>
  </g>

  <!-- 三级缓存与内存 -->
  <rect x="370" y="659" width="461" height="110" fill="#f4d8b1" stroke="#a96925" stroke-width="1.5"/>
  <text x="600" y="729" text-anchor="middle" font-size="28" fill="#1a1a1a">三级Cache</text>
  <rect x="293" y="869" width="640" height="114" fill="#d3ea96" stroke="#82b366" stroke-width="1.5"/>
  <text x="613" y="942" text-anchor="middle" font-size="28" fill="#1a1a1a">内存 （RAM）</text>

  <!-- 连接线 -->
  <g fill="none" stroke="#37393d" stroke-width="1.5">
    <path d="M354 171 V221 H210 V268" marker-end="url(#arrow-35)"/>
    <path d="M354 221 H482 V268" marker-end="url(#arrow-35)"/>
    <path d="M902 171 V221 H758 V268" marker-end="url(#arrow-35)"/>
    <path d="M902 221 H1030 V268" marker-end="url(#arrow-35)"/>

    <path d="M210 363 V410 H482 V363"/>
    <path d="M347 410 V454" marker-end="url(#arrow-35)"/>
    <path d="M758 363 V410 H1030 V363"/>
    <path d="M895 410 V454" marker-end="url(#arrow-35)"/>

    <path d="M347 559 V609 H895 V559"/>
    <path d="M600 609 V656" marker-end="url(#arrow-35)"/>

    <path d="M600 769 V866" marker-end="url(#arrow-35)"/>
  </g>
</svg>
