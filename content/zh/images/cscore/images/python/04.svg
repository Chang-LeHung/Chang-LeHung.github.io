<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2030 592" role="img"
     aria-label="Python 列表的指针结构：a 指向一个装着四个指针的 list，b = a 之后 a 与 b 指向同一份数据"
     font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif">
  <defs>
    <marker id="arrow-python04" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4149"/>
    </marker>
  </defs>

  <!-- 图例 -->
  <rect x="162" y="23" width="66" height="49" rx="10" fill="#fcf1fa" stroke="#3b4149" stroke-width="1.5"/>
  <text x="246" y="58" font-size="26" fill="#4a9d4a">指向真实数据的指针</text>

  <!-- 左侧 list -->
  <rect x="180" y="185" width="350" height="105" rx="12" fill="#f2f2fe" stroke="#3b4149" stroke-width="1.5"/>
  <g fill="#fcf1fa" stroke="#3b4149" stroke-width="1.5">
    <rect x="200" y="208" width="70" height="55" rx="10"/>
    <rect x="285" y="208" width="70" height="55" rx="10"/>
    <rect x="370" y="208" width="70" height="55" rx="10"/>
    <rect x="455" y="208" width="70" height="55" rx="10"/>
  </g>

  <!-- 左侧变量与数据 -->
  <rect x="13" y="128" width="67" height="49" rx="10" fill="#def9f5" stroke="#3b4149" stroke-width="1.5"/>
  <text x="46" y="164" font-size="32" text-anchor="middle">a</text>

  <g fill="#eef5fe" stroke="#3b4149" stroke-width="1.5">
    <rect x="184" y="387" width="66" height="51" rx="10"/>
    <rect x="361" y="456" width="66" height="49" rx="10"/>
    <rect x="584" y="434" width="67" height="49" rx="10"/>
    <rect x="632" y="300" width="66" height="51" rx="10"/>
  </g>
  <g font-size="32" text-anchor="middle">
    <text x="217" y="423">1</text>
    <text x="394" y="490">2</text>
    <text x="617" y="468">3</text>
    <text x="665" y="336">4</text>
  </g>

  <!-- 左侧连线 -->
  <g fill="none" stroke="#3b4149" stroke-width="1.5">
    <path d="M80 152 C125 152 140 200 176 228" marker-end="url(#arrow-python04)"/>
    <path d="M215 263 C215 300 215 340 215 383" marker-end="url(#arrow-python04)"/>
    <path d="M290 263 C310 300 350 400 392 452" marker-end="url(#arrow-python04)"/>
    <path d="M370 263 C420 320 540 370 615 430" marker-end="url(#arrow-python04)"/>
    <path d="M530 228 C580 240 630 270 664 296" marker-end="url(#arrow-python04)"/>
  </g>

  <!-- list 指针 -->
  <path d="M520 185 V118 H760 V55 H1800 V201" fill="none" stroke="#3b4149" stroke-width="1.5"
        marker-end="url(#arrow-python04)"/>
  <rect x="1118" y="36" width="100" height="38" fill="#ffffff"/>
  <text x="1168" y="66" font-size="34" text-anchor="middle">list</text>

  <!-- b = a -->
  <text x="1035" y="300" font-size="33" text-anchor="middle">b  =  a</text>
  <path d="M800 328 H1240" fill="none" stroke="#3b4149" stroke-width="1.5"
        marker-end="url(#arrow-python04)"/>

  <!-- 右侧 -->
  <rect x="1295" y="160" width="66" height="51" rx="10" fill="#def9f5" stroke="#3b4149" stroke-width="1.5"/>
  <text x="1328" y="198" font-size="32" text-anchor="middle">a</text>
  <rect x="1295" y="327" width="66" height="48" rx="10" fill="#def9f5" stroke="#3b4149" stroke-width="1.5"/>
  <text x="1328" y="363" font-size="32" text-anchor="middle">b</text>

  <rect x="1465" y="205" width="345" height="115" rx="12" fill="#f2f2fe" stroke="#3b4149" stroke-width="1.5"/>
  <g fill="#fcf1fa" stroke="#3b4149" stroke-width="1.5">
    <rect x="1485" y="232" width="70" height="55" rx="10"/>
    <rect x="1570" y="232" width="70" height="55" rx="10"/>
    <rect x="1655" y="232" width="70" height="55" rx="10"/>
    <rect x="1740" y="232" width="70" height="55" rx="10"/>
  </g>

  <g fill="#eef5fe" stroke="#3b4149" stroke-width="1.5">
    <rect x="1466" y="423" width="66" height="48" rx="10"/>
    <rect x="1643" y="488" width="66" height="51" rx="10"/>
    <rect x="1866" y="466" width="66" height="51" rx="10"/>
    <rect x="1914" y="336" width="66" height="48" rx="10"/>
  </g>
  <g font-size="32" text-anchor="middle">
    <text x="1499" y="459">1</text>
    <text x="1676" y="524">2</text>
    <text x="1899" y="502">3</text>
    <text x="1947" y="371">4</text>
  </g>

  <g fill="none" stroke="#3b4149" stroke-width="1.5">
    <path d="M1361 185 H1420 C1450 185 1455 230 1462 255" marker-end="url(#arrow-python04)"/>
    <path d="M1361 350 H1420 C1450 350 1455 290 1462 268" marker-end="url(#arrow-python04)"/>
    <path d="M1500 287 C1500 330 1500 380 1500 418" marker-end="url(#arrow-python04)"/>
    <path d="M1585 287 C1590 330 1620 440 1674 484" marker-end="url(#arrow-python04)"/>
    <path d="M1670 287 C1720 340 1830 400 1897 462" marker-end="url(#arrow-python04)"/>
    <path d="M1810 250 C1870 260 1920 300 1946 332" marker-end="url(#arrow-python04)"/>
  </g>
</svg>
