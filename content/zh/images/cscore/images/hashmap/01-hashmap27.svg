<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 919 668" role="img"
     aria-label="HashMap putVal 的流程图：计算下标、判断是否已有数据，冲突时区分红黑树与链表插入，最后更新节点并判断扩容"
     font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif">
  <defs>
    <marker id="arrow-hashmap01" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <text x="60" y="36" font-size="15" font-family="monospace">putVal(int hash, K key, V value, ...)</text>

  <!-- 连线 -->
  <g fill="none" stroke="#444" stroke-width="1.5">
    <path d="M168 46 V80" marker-end="url(#arrow-hashmap01)"/>
    <path d="M204 160 V187" marker-end="url(#arrow-hashmap01)"/>
    <path d="M359 231 H400" marker-end="url(#arrow-hashmap01)"/>
    <path d="M531 231 H604" marker-end="url(#arrow-hashmap01)"/>
    <path d="M468 265 V322" marker-end="url(#arrow-hashmap01)"/>
    <path d="M217 271 V324" marker-end="url(#arrow-hashmap01)"/>
    <path d="M204 399 V576" marker-end="url(#arrow-hashmap01)"/>
    <path d="M468 448 V482" marker-end="url(#arrow-hashmap01)"/>
    <path d="M364 550 H210"/>
    <path d="M750 282 V550 H589" marker-end="url(#arrow-hashmap01)"/>
    <path d="M313 612 H378" marker-end="url(#arrow-hashmap01)"/>
  </g>

  <!-- 计算下标 -->
  <rect x="82" y="88" width="243" height="72" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="203" y="118" font-size="15.5" text-anchor="middle">通过计算 hash &amp; (n - 1)得到数</text>
  <text x="203" y="145" font-size="15.5" text-anchor="middle">据需要放置的下标</text>

  <!-- 判断 -->
  <path d="M217 191 L359 231 L217 271 L76 231 Z" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <text x="217" y="238" font-size="15.5" text-anchor="middle">对应下标是否存在数据</text>
  <text x="338" y="216" font-size="15.5">是</text>
  <text x="228" y="298" font-size="15.5">否</text>

  <!-- 哈希冲突 -->
  <rect x="406" y="198" width="126" height="67" rx="6" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
  <text x="469" y="228" font-size="15.5" text-anchor="middle">进行哈希冲突的</text>
  <text x="469" y="252" font-size="15.5" text-anchor="middle">解决</text>

  <text x="545" y="218" font-size="15.5">红黑树</text>

  <!-- 红黑树分支 -->
  <rect x="610" y="180" width="280" height="102" rx="6" fill="#b1ddf0" stroke="#10739e" stroke-width="1.5"/>
  <text x="750" y="212" font-size="15.5" text-anchor="middle">如果树中不存在相同的key，则插入</text>
  <text x="750" y="240" font-size="15.5" text-anchor="middle">新的节点，若存在则返回对应的节点</text>
  <text x="750" y="268" font-size="15.5" text-anchor="middle">赋值给 e</text>

  <!-- 链表分支 -->
  <text x="478" y="304" font-size="15.5">链表</text>
  <rect x="350" y="328" width="238" height="120" rx="6" fill="#cdeb8b" stroke="#36393d" stroke-width="1.5"/>
  <text x="469" y="358" font-size="15.5" text-anchor="middle">如果链表中不存在相同的key,</text>
  <text x="469" y="386" font-size="15.5" text-anchor="middle">则插入新的节点放在链表末尾</text>
  <text x="469" y="414" font-size="15.5" text-anchor="middle">（尾插法），若存在则返回对应</text>
  <text x="469" y="440" font-size="15.5" text-anchor="middle">的节点赋值给 e</text>

  <!-- 存数组 -->
  <rect x="142" y="330" width="126" height="69" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="205" y="360" font-size="15.5" text-anchor="middle">将数据存储到数</text>
  <text x="205" y="386" font-size="15.5" text-anchor="middle">组当中</text>

  <!-- 更新节点 -->
  <rect x="364" y="488" width="219" height="79" rx="6" fill="#ffff88" stroke="#36393d" stroke-width="1.5"/>
  <text x="473" y="518" font-size="15.5" text-anchor="middle">更新节点 e 的值为传进来的</text>
  <text x="473" y="545" font-size="15.5" text-anchor="middle">参数value</text>

  <!-- 是否扩容 -->
  <rect x="92" y="582" width="221" height="62" rx="6" fill="#ffcc99" stroke="#d79b00" stroke-width="1.5"/>
  <text x="202" y="600" font-size="15.5" text-anchor="middle">判断新加入数据之后，是否</text>
  <text x="202" y="620" font-size="15.5" text-anchor="middle">达到阈值，超过阈值进行扩</text>
  <text x="202" y="640" font-size="15.5" text-anchor="middle">容</text>

  <text x="386" y="618" font-size="20">函数结束</text>
</svg>
