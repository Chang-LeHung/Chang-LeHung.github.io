<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 426" role="img" aria-label="哈希表扩容到长度 16 之后，哈希值前四位为 0100 的元素 1、3、5 落到下标 4 的链表，前四位为 1100 的元素 4、6 落到下标 12 的链表" font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif">
  <defs>
    <marker id="arrow-hashmap31" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111"/>
    </marker>
  </defs>

  <rect x="447" y="35" width="160" height="81" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="527" y="88" font-size="29" fill="#111" text-anchor="middle">扩容之后</text>

  <text x="29" y="153" font-size="17" fill="#111">数组长度 = 16</text>

  <!-- 数组 -->
  <g stroke="#4e544e" stroke-width="1.5">
    <rect x="25" y="171" width="67" height="28" fill="#cdeb8b"/>
    <rect x="92" y="171" width="67" height="28" fill="#ffffff"/>
    <rect x="159" y="171" width="67" height="28" fill="#cdeb8b"/>
    <rect x="226" y="171" width="67" height="28" fill="#ffffff"/>
    <rect x="293" y="171" width="67" height="28" fill="#f8cecc" stroke="#b85450"/>
    <rect x="360" y="171" width="67" height="28" fill="#cdeb8b"/>
    <rect x="427" y="171" width="67" height="28" fill="#cdeb8b"/>
    <rect x="494" y="171" width="67" height="28" fill="#cdeb8b"/>
    <rect x="561" y="171" width="67" height="28" fill="#cdeb8b"/>
    <rect x="628" y="171" width="67" height="28" fill="#ffffff"/>
    <rect x="695" y="171" width="67" height="28" fill="#ffffff"/>
    <rect x="762" y="171" width="67" height="28" fill="#ffffff"/>
    <rect x="829" y="171" width="67" height="28" fill="#f8cecc" stroke="#b85450"/>
    <rect x="896" y="171" width="67" height="28" fill="#ffffff"/>
    <rect x="963" y="171" width="67" height="28" fill="#ffffff"/>
    <rect x="1030" y="171" width="67" height="28" fill="#ffffff"/>
  </g>
  <g font-size="16" fill="#111" text-anchor="middle">
    <text x="326" y="191">0</text>
    <text x="862" y="191">2</text>
  </g>

  <!-- 下标 4 的链表 -->
  <g stroke="#b85450" stroke-width="1.5" fill="#f8cecc">
    <rect x="294" y="228" width="64" height="26"/>
    <rect x="298" y="282" width="64" height="27"/>
    <rect x="294" y="339" width="64" height="27"/>
  </g>
  <g font-size="16" fill="#111" text-anchor="middle">
    <text x="326" y="247">1</text>
    <text x="330" y="301">3</text>
    <text x="326" y="358">5</text>
  </g>

  <!-- 下标 12 的链表 -->
  <g stroke="#b85450" stroke-width="1.5" fill="#f8cecc">
    <rect x="830" y="226" width="64" height="27"/>
    <rect x="830" y="284" width="64" height="27"/>
  </g>
  <g font-size="16" fill="#111" text-anchor="middle">
    <text x="862" y="246">4</text>
    <text x="862" y="304">6</text>
  </g>

  <g fill="none" stroke="#111" stroke-width="1.5">
    <path d="M326 199 V228" marker-end="url(#arrow-hashmap31)"/>
    <path d="M326 254 V282" marker-end="url(#arrow-hashmap31)"/>
    <path d="M330 309 V339" marker-end="url(#arrow-hashmap31)"/>
    <path d="M862 199 V226" marker-end="url(#arrow-hashmap31)"/>
    <path d="M862 253 V284" marker-end="url(#arrow-hashmap31)"/>
  </g>

  <g font-size="17" fill="#111">
    <text x="115" y="247">哈希值前四位 = 0100</text>
    <text x="389" y="245">0100 &amp; 1111 = 4</text>
    <text x="118" y="304">哈希值前四位 = 0100</text>
    <text x="391" y="302">0100 &amp; 1111 = 4</text>
    <text x="118" y="360">哈希值前四位 = 0100</text>
    <text x="389" y="357">0100 &amp; 1111 = 4</text>

    <text x="646" y="249">哈希值前四位 = 1100</text>
    <text x="924" y="249">1100 &amp; 1111 = 12</text>
    <text x="650" y="305">哈希值前四位 = 1100</text>
    <text x="932" y="305">1100 &amp; 1111 = 12</text>
  </g>
