<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1183 552" role="img" aria-label="哈希表扩容时链表拆分：低位链表 loHead loTail 留在下标 1，高位链表 hiHead hiTail 搬到下标 5" font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif" width="1183" height="552">
  <defs>
    <marker id="arrow-hashmap36" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>

  <rect width="1183" height="552" fill="#fff"/>

  <!-- 左：扩容前的数组 -->
  <text x="95" y="62" font-size="30" fill="#111">下标 = 1</text>
  <g stroke="#111" stroke-width="1.5">
    <rect x="27" y="88" width="70" height="34" fill="#fff"/>
    <rect x="99" y="88" width="70" height="34" fill="#f8cecc"/>
    <rect x="171" y="88" width="70" height="34" fill="#fff"/>
    <rect x="243" y="88" width="70" height="34" fill="#d5e8d4"/>
  </g>
  <text x="134" y="113" font-size="26" fill="#111" text-anchor="middle">0</text>

  <!-- 链表节点 -->
  <g stroke="#111" stroke-width="1.5">
    <rect x="99" y="170" width="70" height="32" fill="#dae8fc"/>
    <rect x="99" y="256" width="70" height="32" fill="#f8cecc"/>
    <rect x="99" y="338" width="70" height="32" fill="#dae8fc"/>
  </g>
  <g font-size="26" fill="#111" text-anchor="middle">
    <text x="134" y="194">1</text>
    <text x="134" y="280">2</text>
    <text x="134" y="362">3</text>
  </g>
  <g fill="none" stroke="#111" stroke-width="1.6">
    <path d="M134 122 V166" marker-end="url(#arrow-hashmap36)"/>
    <path d="M134 202 V252" marker-end="url(#arrow-hashmap36)"/>
    <path d="M134 288 V334" marker-end="url(#arrow-hashmap36)"/>
  </g>

  <!-- 中间的说明文字 -->
  <rect x="368" y="170" width="72" height="30" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
  <text x="404" y="192" font-size="24" fill="#111" text-anchor="middle">标号</text>
  <g font-size="17" fill="#111">
    <text x="228" y="232">表示数据的哈希值的二进制表示的第四</text>
    <text x="252" y="265">个比特位为1，也就是文章中提到的</text>
    <text x="228" y="298">高位对应位置为1，因此它在新数组的位置</text>
    <text x="252" y="330">等于原数组的长度(4) + 它在原数组的下标(1) = 5</text>
  </g>

  <rect x="368" y="340" width="72" height="30" fill="#f8cecc" stroke="#b85450" stroke-width="1"/>
  <text x="404" y="362" font-size="24" fill="#111" text-anchor="middle">标号</text>
  <g font-size="17" fill="#111">
    <text x="228" y="408">表示数据的哈希值的二进制表示的第四</text>
    <text x="252" y="442">个比特位为0，也就是文章中提到的</text>
    <text x="228" y="475">高位对应位置为0，因此它在新数组的位置</text>
    <text x="252" y="508">和原数组的位置相同 = 1</text>
  </g>

  <!-- 扩容箭头 -->
  <text x="410" y="80" font-size="30" fill="#111" text-anchor="middle">扩容</text>
  <path d="M378 110 H500" fill="none" stroke="#111" stroke-width="5" marker-end="url(#arrow-hashmap36)"/>

  <!-- 右：扩容后的数组 -->
  <text x="630" y="54" font-size="30" fill="#111">下标 = 1</text>
  <text x="880" y="54" font-size="30" fill="#111">下标 = 1 + 4 = 5</text>
  <g stroke="#111" stroke-width="1.5">
    <rect x="486" y="88" width="70" height="34" fill="#fff"/>
    <rect x="558" y="88" width="70" height="34" fill="#fff"/>
    <rect x="630" y="88" width="70" height="34" fill="#f8cecc"/>
    <rect x="702" y="88" width="70" height="34" fill="#fff"/>
    <rect x="774" y="88" width="70" height="34" fill="#d5e8d4"/>
    <rect x="846" y="88" width="70" height="34" fill="#fff"/>
    <rect x="918" y="88" width="70" height="34" fill="#dae8fc"/>
    <rect x="990" y="88" width="70" height="34" fill="#fff"/>
    <rect x="1062" y="88" width="70" height="34" fill="#fff"/>
  </g>
  <g font-size="26" fill="#111" text-anchor="middle">
    <text x="665" y="113">0</text>
    <text x="953" y="113">1</text>
  </g>

  <!-- 扩容后链表头 -->
  <g stroke="#111" stroke-width="1.5">
    <rect x="630" y="170" width="70" height="32" fill="#f8cecc"/>
    <rect x="918" y="170" width="70" height="32" fill="#dae8fc"/>
  </g>
  <g font-size="26" fill="#111" text-anchor="middle">
    <text x="665" y="194">2</text>
    <text x="953" y="194">3</text>
  </g>
  <g fill="none" stroke="#111" stroke-width="1.6">
    <path d="M665 122 V166" marker-end="url(#arrow-hashmap36)"/>
    <path d="M953 122 V166" marker-end="url(#arrow-hashmap36)"/>
  </g>

  <!-- 四个链表指针 -->
  <g fill="#ffff88" stroke="#111" stroke-width="1.5">
    <circle cx="695" cy="355" r="47"/>
    <circle cx="820" cy="355" r="47"/>
    <circle cx="940" cy="355" r="47"/>
    <circle cx="1075" cy="355" r="47"/>
  </g>
  <g font-size="22" fill="#111" text-anchor="middle">
    <text x="695" y="363">loHead</text>
    <text x="820" y="363">loTail</text>
    <text x="940" y="363">hiHead</text>
    <text x="1075" y="363">hiTail</text>
  </g>

  <!-- 指针连线 -->
  <g fill="none" stroke="#111" stroke-width="1.6">
    <path d="M695 308 C712 268 716 212 706 192" marker-end="url(#arrow-hashmap36)"/>
    <path d="M820 308 C818 236 760 150 706 110" marker-end="url(#arrow-hashmap36)"/>
    <path d="M940 308 C1000 268 1006 214 994 192" marker-end="url(#arrow-hashmap36)"/>
    <path d="M1075 308 C1075 236 1020 150 994 110" marker-end="url(#arrow-hashmap36)"/>
  </g>
</svg>
