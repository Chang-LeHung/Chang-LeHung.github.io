    <rect x="174" y="37" width="38" height="29"/>
    <rect x="236" y="37" width="38" height="29"/>
    <rect x="333" y="37" width="38" height="29"/>
    <rect x="396" y="37" width="38" height="29"/>
    <rect x="457" y="37" width="38" height="29"/>
    <rect x="518" y="37" width="38" height="29"/>
    <rect x="573" y="37" width="38" height="29"/>
    <rect x="632" y="37" width="38" height="29"/>
