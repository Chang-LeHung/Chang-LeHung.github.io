<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 981 596" role="img"
     aria-label="顺序队列扩容示意：环状使用的数组由 tail 与 head 指向，绿色为已用的 0-3，粉色为 4-7，扩容后数据被搬到一个 16 格的数组中"
     font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif">
  <defs>
    <marker id="arrow-21" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- 上半部分：8 格数组与 tail / head -->
  <path d="M190 53 V29 H726 V55" fill="none" stroke="#444" stroke-width="1.5"/>
