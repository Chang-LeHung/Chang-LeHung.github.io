      <rect x="572" y="493" width="40" height="33"/>
    </g>
    <text x="237" y="516">3</text>
    <text x="288" y="516">2</text>
    <text x="339" y="516">1</text>
    <text x="389" y="516">0</text>
    <text x="440" y="516">7</text>
    <text x="491" y="516">6</text>
