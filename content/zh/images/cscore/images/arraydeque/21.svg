  <path d="M206 206 H672" fill="none" stroke="#444" stroke-width="1.5"/>
  <text x="697" y="161" font-size="21">数组数据对应的逻辑顺序</text>

  <!-- 扩容箭头 -->
  <path d="M400 213 H453 V323 H470 L423.5 363 L377 323 H400 Z" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
  <text x="466" y="276" font-size="21">扩容之后</text>

