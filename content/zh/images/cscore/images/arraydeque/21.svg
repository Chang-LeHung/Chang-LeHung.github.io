      <rect x="510" y="60" width="41" height="30"/>
      <rect x="551" y="60" width="41" height="30"/>
    </g>
    <text x="284" y="82">0</text>
    <text x="325" y="82">1</text>
    <text x="366" y="82">2</text>
    <text x="407" y="82">3</text>
    <text x="448" y="82">4</text>
    <text x="489" y="82">5</text>
    <text x="530" y="82">6</text>
    <text x="571" y="82">7</text>
  </g>

  <path d="M206 116 H672" fill="none" stroke="#444" stroke-width="1.5"/>
  <g stroke-width="1.5" font-size="18" text-anchor="middle">
    <g fill="#d5e8d4" stroke="#82b366">
      <rect x="203" y="130" width="40" height="33"/>
      <rect x="253" y="130" width="40" height="33"/>
      <rect x="303" y="130" width="40" height="33"/>
      <rect x="353" y="130" width="40" height="33"/>
