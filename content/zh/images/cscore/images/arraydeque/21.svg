    <g fill="#f8cecc" stroke="#b85450">
      <rect x="403" y="130" width="40" height="33"/>
      <rect x="453" y="130" width="40" height="33"/>
      <rect x="503" y="130" width="40" height="33"/>
      <rect x="553" y="130" width="40" height="33"/>
