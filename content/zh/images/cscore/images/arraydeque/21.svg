  <rect x="160" y="53" width="59" height="42" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="189" y="81" text-anchor="middle" font-size="19">tail</text>
  <rect x="699" y="55" width="56" height="42" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="727" y="83" text-anchor="middle" font-size="19">head</text>

