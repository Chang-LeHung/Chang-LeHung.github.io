      <rect x="547" y="399" width="40" height="30"/>
      <rect x="587" y="399" width="40" height="30"/>
      <rect x="627" y="399" width="40" height="30"/>
      <rect x="667" y="399" width="40" height="30"/>
      <rect x="707" y="399" width="40" height="30"/>
      <rect x="747" y="399" width="40" height="30"/>
