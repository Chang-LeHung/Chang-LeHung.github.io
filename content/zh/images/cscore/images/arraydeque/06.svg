<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 896 352" role="img" aria-label="数组的 0 到 15 号格子，0 到 3 与 8 到 15 存有数据，下方 tail=4 与 head=8 两个标注分别指向 4 号和 8 号格子，左上角是图例" font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif" width="896" height="352">
  <defs>
    <marker id="arrow-06" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- 图例 -->
  <rect x="139.5" y="29.5" width="41" height="30" fill="#fff" stroke="#444" stroke-width="1.5"/>
  <text x="206" y="53" font-size="22" fill="#000">不存在数据</text>
  <rect x="139.5" y="81" width="41" height="30" fill="#cdeb8b" stroke="#444" stroke-width="1.5"/>
  <text x="206" y="105" font-size="22" fill="#000">存在数据</text>

  <!-- 上下两条横线 -->
  <path d="M75 152.5 H828 M75 210 H828" fill="none" stroke="#444" stroke-width="1.5"/>

  <!-- 数组：0-3 与 8-15 有数据 -->
  <rect x="132" y="166" width="160" height="30" fill="#cdeb8b" stroke="none"/>
  <rect x="452" y="166" width="320" height="30" fill="#cdeb8b" stroke="none"/>
  <rect x="132" y="166" width="640" height="30" fill="none" stroke="#36393d" stroke-width="1.5"/>
  <path d="M172 166 V196 M212 166 V196 M252 166 V196 M292 166 V196 M332 166 V196 M372 166 V196
           M412 166 V196 M452 166 V196 M492 166 V196 M532 166 V196 M572 166 V196 M612 166 V196
           M652 166 V196 M692 166 V196 M732 166 V196"
        fill="none" stroke="#36393d" stroke-width="1.5"/>

  <g font-size="22" fill="#000" text-anchor="middle">
    <text x="152" y="189">0</text>
    <text x="192" y="189">1</text>
    <text x="232" y="189">2</text>
    <text x="272" y="189">3</text>
    <text x="312" y="189">4</text>
    <text x="352" y="189">5</text>
    <text x="392" y="189">6</text>
    <text x="432" y="189">7</text>
    <text x="472" y="189">8</text>
    <text x="512" y="189">9</text>
    <text x="552" y="189">10</text>
    <text x="592" y="189">11</text>
    <text x="632" y="189">12</text>
    <text x="672" y="189">13</text>
    <text x="712" y="189">14</text>
    <text x="752" y="189">15</text>
  </g>

  <!-- tail 与 head 标注 -->
  <path d="M243 282.5 H312 V200" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow-06)"/>
  <rect x="166" y="263" width="77" height="40" rx="6" fill="#ffcccc" stroke="#444" stroke-width="1.5"/>
  <text x="204.5" y="289" font-size="20" fill="#000" text-anchor="middle">tail=4</text>

  <path d="M472 282.5 H533" fill="none" stroke="#444" stroke-width="1.5"/>
  <path d="M472 282.5 V200" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow-06)"/>
  <rect x="533" y="263" width="84" height="40" rx="6" fill="#ffcccc" stroke="#444" stroke-width="1.5"/>
  <text x="575" y="289" font-size="20" fill="#000" text-anchor="middle">head=8</text>
</svg>
