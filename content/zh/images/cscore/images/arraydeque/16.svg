    <text x="226.2" y="129">2</text>
    <text x="265.5" y="129">3</text>
    <text x="304.8" y="129">4</text>
    <text x="344.1" y="129">5</text>
    <text x="383.4" y="129">6</text>
    <text x="422.7" y="129">7</text>
    <text x="462" y="129">8</text>
    <text x="501.3" y="129">9</text>
    <text x="540.6" y="129">10</text>
