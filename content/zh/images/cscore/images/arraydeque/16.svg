  <line x1="68" y1="156" x2="832" y2="156" stroke="#444" stroke-width="1.5"/>

  <text x="345" y="201" text-anchor="middle" font-size="20">逻辑数据顺序</text>
  <line x1="68" y1="228" x2="832" y2="228" stroke="#444" stroke-width="1.5"/>

  <!-- 第二行：逻辑顺序，队头在下标 3 -->
  <g fill="#cdeb8b" stroke="#3b3b3b" stroke-width="1">
