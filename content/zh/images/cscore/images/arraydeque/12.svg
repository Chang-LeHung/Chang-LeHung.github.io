<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 938 587" role="img" aria-label="两行数组对比出队前后：第一行 8 号格子标黄、tail=4 与 head=8 指向 4 号与 8 号格子，中间空心箭头向下，第二行 9 号格子开始有数据、tail=4 与 head=9 指向 4 号与 9 号格子，右侧黄框里是被出队的 8"
     font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif">
  <defs>
    <marker id="arrow-12" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- 图例 -->
  <rect x="111" y="21" width="40" height="30" fill="#ffff88" stroke="#444" stroke-width="1.5"/>
  <text x="173" y="45" font-size="22" fill="#000">即将出队的数据</text>
  <rect x="111" y="73.5" width="40.5" height="30.5" fill="#fff" stroke="#444" stroke-width="1.5"/>
  <text x="173" y="97" font-size="22" fill="#000">不存在数据</text>
  <rect x="111" y="126" width="40" height="30" fill="#cdeb8b" stroke="#444" stroke-width="1.5"/>
  <text x="173" y="150" font-size="22" fill="#000">存在数据</text>

  <!-- 第一行数组 -->
  <path d="M47 197.5 H800 M47 255 H800" fill="none" stroke="#444" stroke-width="1.5"/>
  <rect x="104" y="211" width="160" height="30" fill="#cdeb8b" stroke="none"/>
  <rect x="424" y="211" width="40" height="30" fill="#ffff88" stroke="none"/>
  <rect x="464" y="211" width="280" height="30" fill="#cdeb8b" stroke="none"/>
  <rect x="104" y="211" width="640" height="30" fill="none" stroke="#36393d" stroke-width="1.5"/>
  <path d="M144 211 V241 M184 211 V241 M224 211 V241 M264 211 V241 M304 211 V241
           M344 211 V241 M384 211 V241 M424 211 V241 M464 211 V241 M504 211 V241
           M544 211 V241 M584 211 V241 M624 211 V241 M664 211 V241 M704 211 V241"
        fill="none" stroke="#36393d" stroke-width="1.5"/>
  <g font-size="22" fill="#000" text-anchor="middle">
    <text x="124" y="236">0</text>
    <text x="164" y="236">1</text>
    <text x="204" y="236">2</text>
    <text x="244" y="236">3</text>
    <text x="284" y="236">4</text>
    <text x="324" y="236">5</text>
    <text x="364" y="236">6</text>
    <text x="404" y="236">7</text>
    <text x="444" y="236">8</text>
    <text x="484" y="236">9</text>
    <text x="524" y="236">10</text>
    <text x="564" y="236">11</text>
    <text x="604" y="236">12</text>
    <text x="644" y="236">13</text>
    <text x="684" y="236">14</text>
    <text x="724" y="236">15</text>
  </g>

  <!-- 右端虚线空心箭头 -->
  <path d="M762 218 H837 V208 L887 223 L837 238 V231 H762 Z" fill="none" stroke="#444"
        stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 第一行 tail / head -->
  <path d="M215 327 H284 V241" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow-12)"/>
  <rect x="138" y="307" width="77" height="40" rx="6" fill="#ffcccc" stroke="#444" stroke-width="1.5"/>
  <text x="176.5" y="333" font-size="20" fill="#000" text-anchor="middle">tail=4</text>

  <path d="M506 327 H444 V241" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow-12)"/>
  <rect x="506" y="307" width="83" height="40" rx="6" fill="#ffcccc" stroke="#444" stroke-width="1.5"/>
  <text x="547.5" y="333" font-size="20" fill="#000" text-anchor="middle">head=8</text>

  <!-- 中间空心向下箭头 -->
  <path d="M344 278 H360 V335 H371 L351.5 386 L332 335 H344 Z" fill="#fff" stroke="#444" stroke-width="1.5"/>

  <!-- 第二行数组 -->
  <path d="M44 397 H797 M44 454.5 H797" fill="none" stroke="#444" stroke-width="1.5"/>
  <rect x="100" y="411" width="160" height="30" fill="#cdeb8b" stroke="none"/>
  <rect x="460" y="411" width="280" height="30" fill="#cdeb8b" stroke="none"/>
  <rect x="100" y="411" width="640" height="30" fill="none" stroke="#36393d" stroke-width="1.5"/>
  <path d="M140 411 V441 M180 411 V441 M220 411 V441 M260 411 V441 M300 411 V441
           M340 411 V441 M380 411 V441 M420 411 V441 M460 411 V441 M500 411 V441
           M540 411 V441 M580 411 V441 M620 411 V441 M660 411 V441 M700 411 V441"
        fill="none" stroke="#36393d" stroke-width="1.5"/>
  <g font-size="22" fill="#000" text-anchor="middle">
    <text x="120" y="436">0</text>
    <text x="160" y="436">1</text>
    <text x="200" y="436">2</text>
    <text x="240" y="436">3</text>
    <text x="280" y="436">4</text>
    <text x="320" y="436">5</text>
    <text x="360" y="436">6</text>
    <text x="400" y="436">7</text>
    <text x="440" y="436">8</text>
    <text x="480" y="436">9</text>
    <text x="520" y="436">10</text>
    <text x="560" y="436">11</text>
    <text x="600" y="436">12</text>
    <text x="640" y="436">13</text>
    <text x="680" y="436">14</text>
    <text x="720" y="436">15</text>
  </g>

  <!-- 第二行 tail / head -->
  <path d="M211 527 H240 V441" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow-12)"/>
  <rect x="134" y="507" width="77" height="40" rx="6" fill="#ffcccc" stroke="#444" stroke-width="1.5"/>
  <text x="172.5" y="533" font-size="20" fill="#000" text-anchor="middle">tail=4</text>

  <path d="M510 527 H480 V441" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow-12)"/>
  <rect x="510" y="507" width="84" height="40" rx="6" fill="#ffcccc" stroke="#444" stroke-width="1.5"/>
  <text x="552" y="533" font-size="20" fill="#000" text-anchor="middle">head=9</text>

  <!-- 出队的元素 -->
  <rect x="860" y="411" width="44" height="30" fill="#ffff88" stroke="#36393d" stroke-width="1.5"/>
  <text x="882" y="436" font-size="22" fill="#000" text-anchor="middle">8</text>
</svg>
