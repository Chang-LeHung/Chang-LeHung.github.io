<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 417 251" role="img" aria-label="栈帧布局：栈上依次是栈帧1、rip、rbp，rbp 寄存器指向 rbp 所在位置" font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif" width="417" height="251">
  <defs>
    <marker id="arrow-pl01" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <rect width="417" height="251" fill="#fff"/>

  <!-- 栈：四段 -->
  <rect x="210" y="29" width="60" height="44" fill="#d5e5fa" stroke="#6c8ebf" stroke-width="1"/>
  <rect x="210" y="73" width="60" height="38" fill="#fee2c7" stroke="#d79b00" stroke-width="1"/>
  <rect x="210" y="111" width="60" height="20" fill="#d1e3cf" stroke="#82b366" stroke-width="1"/>
  <rect x="210" y="131" width="60" height="20" fill="#f4c9c6" stroke="#b85450" stroke-width="1"/>
  <rect x="210" y="151" width="60" height="61" fill="#d5e5fa" stroke="#6c8ebf" stroke-width="1"/>

  <g text-anchor="middle" fill="#111">
    <text x="240" y="99" font-size="19">栈帧1</text>
    <text x="240" y="127" font-size="18">rip</text>
    <text x="240" y="147" font-size="18">rbp</text>
  </g>

  <!-- rbp 寄存器指向 -->
  <rect x="37" y="131" width="110" height="42" fill="#ffefc8" stroke="#d6b656" stroke-width="1"/>
  <text x="92" y="157" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">rbp 寄存器指向</text>
  <path d="M148 152 H208" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#arrow-pl01)"/>

  <!-- 字节数说明 -->
  <g font-size="17" fill="#111">
    <text x="288" y="122">64: 8 个字节</text>
    <text x="288" y="147">32: 4 个字节</text>
  </g>
</svg>
