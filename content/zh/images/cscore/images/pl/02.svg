<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 503 276" role="img"
     aria-label="函数调用时的栈帧示意：主函数的 rbp、rsp 指向栈帧上下边界，rip、rbp 保存在中间，下面是 func_a 的栈帧"
     font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif">
  <defs>
    <marker id="arrow-02" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- 中间的栈帧柱 -->
  <g stroke-width="1.5">
    <rect x="191" y="26" width="59" height="43" fill="#d5e5fa" stroke="#6c8ebf"/>
    <rect x="191" y="70" width="59" height="37" fill="#fee2c7" stroke="#ce9125"/>
    <rect x="191" y="108" width="59" height="19" fill="#d1e3cf" stroke="#82b366"/>
    <rect x="191" y="128" width="59" height="20" fill="#f4c9c6" stroke="#b85450"/>
    <rect x="191" y="148" width="59" height="37" fill="#fee2c7" stroke="#ce9125"/>
    <rect x="191" y="186" width="59" height="22" fill="#d5e5fa" stroke="#6c8ebf"/>
  </g>
  <text x="220" y="122" text-anchor="middle" font-size="14" fill="#1a1a1a">rip</text>
  <text x="220" y="142" text-anchor="middle" font-size="14" fill="#1a1a1a">rbp</text>

  <!-- 六个说明框 -->
  <g stroke-width="1.5">
    <rect x="19" y="16" width="109" height="41" fill="#ffefc8" stroke="#cfac56"/>
    <rect x="27" y="141" width="109" height="41" fill="#ffefc8" stroke="#cfac56"/>
    <rect x="337" y="40" width="109" height="41" fill="#dbd0e2" stroke="#886b99"/>
    <rect x="370" y="113" width="109" height="41" fill="#ffefc8" stroke="#cfac56"/>
    <rect x="329" y="164" width="109" height="41" fill="#ffefc8" stroke="#cfac56"/>
    <rect x="293" y="219" width="108" height="41" fill="#dbd0e2" stroke="#886b99"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#1a1a1a">
    <text x="73" y="42">主函数 rbp</text>
    <text x="81" y="167">主函数 rsp</text>
    <text x="391" y="64">主函数栈帧</text>
    <text x="424" y="139">func_a rbp</text>
    <text x="383" y="190">func_a rsp</text>
    <text x="347" y="244">func_a 栈帧</text>
  </g>

  <!-- 两个偏移量说明 -->
  <text x="277" y="114" font-size="14" fill="#1a1a1a">64: 8个字节</text>
  <text x="276" y="129" font-size="14" fill="#1a1a1a">32: 4个字节</text>

  <g fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#arrow-02)">
    <path d="M128 36 H162 V72 H186"/>
    <path d="M136 161 H162 V107 H186"/>
    <path d="M337 60 H293 V88 H257"/>
    <path d="M370 137 H317 V147 H257"/>
    <path d="M329 184 H270 V166 H257"/>
    <path d="M293 239 H270 V186 H257"/>
  </g>
</svg>
