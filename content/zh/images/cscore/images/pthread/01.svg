<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 285 415" role="img" aria-label="传统进程只有一个执行流：栈向低地址方向增长，寄存器保存当前执行位置，堆、数据段和代码段在同一地址空间里" font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif">
  <text x="27" y="28" font-size="26" fill="#111">Traditional Process</text>

  <rect x="26" y="51" width="100" height="302" fill="#26affa"/>

  <g fill="#111" font-size="21">
    <text x="50" y="84">Stack</text>
    <text x="52" y="283">Heap</text>
    <text x="55" y="307">Data</text>
    <text x="50" y="333">Code</text>
  </g>

  <!-- 栈向下增长 -->
  <path d="M112 64 V88" fill="none" stroke="#111" stroke-width="3"/>
  <path d="M104 80 L112 96 L120 80 Z" fill="#111"/>

  <!-- 寄存器 -->
  <path d="M126 75 H152" fill="none" stroke="#111" stroke-width="2"/>
  <circle cx="137" cy="75" r="4.5" fill="#111"/>
  <circle cx="152" cy="75" r="4.5" fill="#111"/>
  <rect x="152" y="58" width="123" height="34" fill="#57e14c" stroke="#111" stroke-width="1.5"/>
  <text x="160" y="84" font-size="21" fill="#111">Registers</text>

  <text x="11" y="398" font-size="28" fill="#111">Single execution flow</text>
</svg>
