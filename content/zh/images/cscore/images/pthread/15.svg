<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 506 325" role="img" aria-label="执行 pthread_cleanup_pop 后，clean-up handler stack 顶部的 handler1 被弹出，栈变为空" font-family="Seaford, 'Songti SC', STSong, SimSun, 'Noto Serif CJK SC', Palatino, 'Source Serif Pro', serif" width="506" height="325">
  <defs>
    <marker id="arrow-pthread15" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <rect width="506" height="325" fill="#fff"/>

  <!-- 左：弹出前的 handler 栈 -->
  <rect x="76" y="24" width="55" height="228" fill="#d1e3cf" stroke="#7da762" stroke-width="1"/>
  <rect x="76" y="208" width="55" height="44" fill="#d5e5fa" stroke="#6c8ebf" stroke-width="1"/>
  <text x="103" y="236" font-size="13" text-anchor="middle" fill="#111">handler1</text>

  <!-- 右：弹出后的 handler 栈 -->
  <rect x="360" y="24" width="55" height="228" fill="#d1e3cf" stroke="#7da762" stroke-width="1"/>

  <!-- 中间的箭头与说明 -->
  <path d="M173 94 H303" fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#arrow-pthread15)"/>
  <g font-size="12" text-anchor="middle" fill="#111">
    <text x="240" y="164">执行 pthread_cleanup_pop 函数</text>
    <text x="240" y="179">因为参数不为0 因此会执行函数</text>
  </g>

  <g font-size="19" fill="#111">
    <text x="20" y="297">clean-up handler stack</text>
    <text x="305" y="297">clean-up handler stack</text>
  </g>
</svg>
